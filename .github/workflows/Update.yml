name: X-SIGN Description Translation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsign-description-translation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Add description translation
        shell: bash
        run: |
          python3 - <<'XSIGN_PY'
          from pathlib import Path
          import re

          swift_code = r'''import SwiftUI
          import Translation

          struct XSignTranslatableDescription: View {
              let text: String
              let accentColor: Color

              @State private var isTranslationPresented = false
              @State private var translatedText: String?
              @State private var isExpanded = false

              var body: some View {
                  Group {
                      if #available(iOS 17.4, macOS 14.4, *) {
                          content
                              .translationPresentation(
                                  isPresented: $isTranslationPresented,
                                  text: text
                              ) { result in
                                  translatedText = result
                                  isExpanded = true
                                  isTranslationPresented = false
                              }
                      } else {
                          content
                      }
                  }
                  .onChange(of: text) { _ in
                      isTranslationPresented = false
                      translatedText = nil
                      isExpanded = false
                  }
              }

              private var content: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      HStack(alignment: .firstTextBaseline) {
                          Text("الوصف")
                              .font(.system(size: 22, weight: .bold))
                              .foregroundStyle(.white)

                          Spacer(minLength: 12)

                          if #available(iOS 17.4, macOS 14.4, *) {
                              Button {
                                  isTranslationPresented = true
                              } label: {
                                  Label("ترجمة الوصف", systemImage: "translate")
                                      .font(.subheadline.weight(.semibold))
                              }
                              .foregroundStyle(accentColor)
                              .buttonStyle(.plain)
                              .disabled(
                                  text.trimmingCharacters(
                                      in: .whitespacesAndNewlines
                                  ).isEmpty
                              )
                          }
                      }

                      Text(verbatim: translatedText ?? text)
                          .font(.system(size: 15))
                          .foregroundStyle(.white.opacity(0.88))
                          .lineSpacing(5)
                          .lineLimit(isExpanded ? nil : 6)
                          .textSelection(.enabled)

                      HStack(spacing: 18) {
                          Button(isExpanded ? "عرض أقل" : "المزيد") {
                              withAnimation(.easeInOut(duration: 0.2)) {
                                  isExpanded.toggle()
                              }
                          }

                          if translatedText != nil {
                              Button("عرض الأصل") {
                                  translatedText = nil
                              }
                          }
                      }
                      .font(.subheadline.weight(.bold))
                      .foregroundStyle(accentColor)
                      .buttonStyle(.plain)
                  }
              }
          }
          '''

          source = Path(
              "Feather/Views/Sources/SourcesView.swift"
          )
          helper = Path(
              "Feather/Views/Sources/Apps/Detail/"
              "XSignTranslatableDescription.swift"
          )

          text = source.read_text(encoding="utf-8")

          start = text.index(
              "struct AppStore2026DetailView: View {"
          )
          end = text.index(
              "struct AppStoreStatBadge: View {",
              start
          )

          detail = text[start:end]

          pattern = re.compile(
              r'^([ \t]*)VStack\(alignment: \.leading, spacing: 10\) \{\n'
              r'[ \t]*Text\("الوصف"\).*?^\1\}\n'
              r'\1\.padding\(\.horizontal, 18\)',
              re.MULTILINE | re.DOTALL
          )

          matches = list(pattern.finditer(detail))

          call = (
              "XSignTranslatableDescription("
              "text: displayDescription, accentColor: accentColor)"
          )

          if len(matches) == 1:
              match = matches[0]
              indent = match.group(1)

              replacement = (
                  indent + call
                  + "\n"
                  + indent + ".padding(.horizontal, 18)"
              )

              detail = (
                  detail[:match.start()]
                  + replacement
                  + detail[match.end():]
              )

              detail = re.sub(
                  r'^[ \t]*@State private var isDescriptionExpanded = false\n',
                  "",
                  detail,
                  count=1,
                  flags=re.MULTILINE
              )

          elif len(matches) == 0 and call in detail:
              pass

          else:
              raise SystemExit(
                  "Description section changed; no files were written."
              )

          if (
              helper.exists()
              and helper.read_text(encoding="utf-8") != swift_code
          ):
              raise SystemExit(
                  "Translation helper has other changes; "
                  "no files were written."
              )

          helper.parent.mkdir(parents=True, exist_ok=True)
          helper.write_text(swift_code, encoding="utf-8")

          source.write_text(
              text[:start] + detail + text[end:],
              encoding="utf-8"
          )

          print("Description translation button added.")
          XSIGN_PY

      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail

          if [ -d /Applications/Xcode_26.3.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          elif [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi

          xcodebuild -version
          make
          test -s packages/X-SIGN.ipa

      - name: Save reviewed changes
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            Feather/Views/Sources/SourcesView.swift \
            Feather/Views/Sources/Apps/Detail/XSignTranslatableDescription.swift

          if ! git diff --cached --quiet; then
            UPDATE_BRANCH="xsign-translation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

            git switch -c "$UPDATE_BRANCH"

            git \
              -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Add native description translation button'

            git push origin "HEAD:refs/heads/$UPDATE_BRANCH"

            echo "Updated branch: $UPDATE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: X-SIGN-Description-Translation
          path: packages/X-SIGN.ipa
          if-no-files-found: error
