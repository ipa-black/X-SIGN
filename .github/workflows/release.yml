name: Build X-SIGN

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_26.3.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          fi
          xcodebuild -version

      - name: Build
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          make

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/*.app/Info.plist)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-SIGN-v${{ env.VERSION }}
          path: packages/*
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: X-SIGN v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          files: |
            packages/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
