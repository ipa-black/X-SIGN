name: Build X-SIGN

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Select Stable Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Fix Makefile Workspace Bug
        run: |
          # هذا السطر يحل المشكلة جذرياً: يقوم بتغيير project إلى workspace داخل الـ Makefile لمنع انهيار Xcode
          sed -i '' 's/-project Feather.xcodeproj/-workspace Feather.xcworkspace/g' Makefile

      - name: Build
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          make

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/*.app/Info.plist)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-SIGN-v${{ env.VERSION }}
          path: packages/*
          if-no-files-found: warn

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          name: X-SIGN v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          files: |
            packages/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
