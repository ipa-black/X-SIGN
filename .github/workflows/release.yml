name: Build and Release X-SIGN

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 2. Select Xcode 26
        run: |
          if [ -d "/Applications/Xcode_26.3.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi
          xcodebuild -version

      - name: 3. Clear Caches
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: 4. Build
        run: |
          agvtool new-version -all $(git rev-parse HEAD) || true
          make

      - name: 5. Get Version & Package IPA
        run: |
          mkdir -p output_artifacts
          if [ -d "_build/Payload" ]; then
            VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/*.app/Info.plist 2>/dev/null || echo "1.0")
            echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
            cd _build
            zip -qry9 ../output_artifacts/X-SIGN-v${VERSION}.ipa Payload
            cd ..
          elif ls packages/*.ipa 1> /dev/null 2>&1; then
            cp packages/*.ipa output_artifacts/
            echo "APP_VERSION=1.0" >> $GITHUB_ENV
          fi

      - name: 6. Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: X-SIGN-Application
          path: output_artifacts/*.ipa

      - name: 7. Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: X-SIGN v${{ env.APP_VERSION || '1.0' }}
          tag_name: v${{ env.APP_VERSION || '1.0' }}.${{ github.run_number }}
          files: |
            output_artifacts/*.ipa
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
