      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.3.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          elif [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi
          xcodebuild -version

      - name: Bundle a small first-launch catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'XSIGN_SEED_PY'
          import base64
          import json
          import urllib.request
          from pathlib import Path
          
          ROOT = Path.cwd() / 'Feather' / 'Resources'
          ROOT.mkdir(parents=True, exist_ok=True)
          FALLBACK_IPABLACK = base64.b64decode('')
          TARGETS = [
              ('XSignLaunchIPABlack.json', 'https://raw.githubusercontent.com/ipa-black/IPABLACK/refs/heads/main/repo.json'),
              ('XSignLaunchStoreAPI.json', 'https://raw.githubusercontent.com/ipa-black/store-api/main/public/repo.json'),
          ]
          APP_KEYS = {'name', 'bundleIdentifier', 'subtitle', 'localizedDescription', 'developerName',
                      'iconURL', 'downloadURL', 'version', 'size', 'category', 'versions', 'screenshots', 'screenshotURLs'}
          ROOT_KEYS = {'name', 'identifier', 'iconURL', 'tintColor', 'news'}
          URL_KEYS = {'iconURL', 'website', 'headerURL', 'imageURL', 'url'}
          
          
          def sanitize(value):
              if isinstance(value, dict):
                  return {key: sanitize(item) for key, item in value.items()
                          if not (key in URL_KEYS and isinstance(item, str) and not item.strip())}
              if isinstance(value, list):
                  return [sanitize(item) for item in value]
              return value
          
          
          def preview(raw):
              root = json.loads(raw)
              if not isinstance(root, dict) or not isinstance(root.get('apps'), list) or not root['apps']:
                  raise ValueError('Source has no application list')
              result = {key: value for key, value in root.items() if key in ROOT_KEYS}
              if isinstance(result.get('news'), list):
                  result['news'] = result['news'][:2]
              page = []
              for app in root['apps'][:24]:
                  if not isinstance(app, dict):
                      continue
                  item = {key: value for key, value in app.items() if key in APP_KEYS}
                  for key in ['subtitle', 'localizedDescription']:
                      if isinstance(item.get(key), str):
                          item[key] = item[key][:800]
                  if isinstance(item.get('versions'), list):
                      item['versions'] = item['versions'][:1]
                  if isinstance(item.get('screenshotURLs'), list):
                      item['screenshotURLs'] = item['screenshotURLs'][:3]
                  page.append(item)
              while page:
                  result['apps'] = page
                  encoded = json.dumps(sanitize(result), ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()
                  if len(encoded) <= 131_072:
                      return encoded
                  page.pop()
              raise ValueError('No bounded launch preview could be created')
          
          
          for name, url in TARGETS:
              destination = ROOT / name
              content = None
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'X-SIGN-Build'})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      content = preview(response.read())
              except Exception as error:
                  print(f'::warning::{name}: using a saved launch preview ({type(error).__name__}).')
              if content is None and destination.is_file():
                  try:
                      content = preview(destination.read_bytes())
                  except (ValueError, TypeError, KeyError):
                      pass
              if content is None and name == 'XSignLaunchIPABlack.json':
                  content = preview(FALLBACK_IPABLACK)
              if content is not None:
                  destination.write_bytes(content)
                  print(f'{name}: {len(json.loads(content)["apps"])} apps, {len(content)} bytes')
          
          if not any(ROOT.glob('XSignLaunch*.json')):
              raise SystemExit('No launch catalog is available to bundle.')
          XSIGN_SEED_PY

      - name: Build and package IPA
        shell: bash
        run: |
          set -euo pipefail
          make 2>&1 | tee "$RUNNER_TEMP/xsign-build.log"
          test -f packages/X-SIGN.ipa
          test -f _build/Payload/X-SIGN.app/XSignLaunchIPABlack.json

      - name: Save successful fixes in the original files
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            Feather/FeatherApp.swift \
            Feather/Utilities/FR.swift \
            Feather/Views/Library/Info/LibraryInfoView.swift \
            Feather/Views/Library/LibraryView.swift \
            Feather/Views/Settings/Appearance/AppearanceTintColorView.swift \
            Feather/Views/Settings/Appearance/AppearanceView.swift \
            Feather/Views/Settings/SettingsView.swift \
            Feather/Views/Sources/SourcesAddView.swift \
            Feather/Views/Sources/SourcesView.swift \
            Feather/Views/Sources/SourcesViewModel.swift
          for launch_seed in Feather/Resources/XSignLaunchIPABlack.json Feather/Resources/XSignLaunchStoreAPI.json; do
            if [ -f "$launch_seed" ]; then
              git add -- "$launch_seed"
            fi
          done
          if git diff --cached --quiet; then
            echo "Fixes already saved; no duplicate commit needed."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Optimize XSign startup, catalog refresh, and resource usage"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XSign-Fixed-IPA
          path: packages/X-SIGN.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XSign-Build-Log
          path: ${{ runner.temp }}/xsign-build.log
          if-no-files-found: ignore
          retention-days: 7
