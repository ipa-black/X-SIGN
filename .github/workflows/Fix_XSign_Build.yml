      - name: Verify FIFO queue and serialized package work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'XSIGN_QUEUE_TEST_PY'
          import os
          from pathlib import Path
          source = Path('Feather/Views/Sources/SourcesView.swift').read_text()
          start = source.index('// MARK: - Serial FIFO download queue')
          end = source.index('// MARK: - Universal IPABlack', start)
          model = source[start:end]
          utility = Path('Feather/Utilities/FR.swift').read_text()
          start = utility.index('// MARK: - Serial package work gate')
          end = utility.index('enum FR {', start)
          gate = utility[start:end]
          checks = r'''
          var queue = XSignSerialQueue<String>()
          precondition(queue.enqueue(key: "first", value: "A"))
          precondition(!queue.enqueue(key: "first", value: "duplicate"))
          precondition(queue.enqueue(key: "second", value: "B"))
          precondition(queue.next()?.value == "A")
          precondition(queue.next()?.key == nil)
          precondition(!queue.finish(key: "second"))
          precondition(queue.finish(key: "first"))
          precondition(queue.next()?.value == "B")
          precondition(queue.finish(key: "second"))
          precondition(queue.enqueue(key: "first", value: "retry"))
          precondition(queue.next()?.value == "retry")
          precondition(queue.finish(key: "first"))
          for index in 0..<1000 {
              precondition(queue.enqueue(key: "job-\(index)", value: "\(index)"))
          }
          for index in 0..<1000 {
              precondition(queue.next()?.value == "\(index)")
              precondition(queue.finish(key: "job-\(index)"))
          }
          precondition(queue.pendingCount == 0 && queue.next()?.key == nil)
          print("PASS: FIFO, duplicate prevention, one active item, retry, and queue compaction")

          actor WorkCounter {
              private var active = 0
              private var maximum = 0
              private var completed = 0
              func enter() { active += 1; maximum = max(maximum, active) }
              func leave() { active -= 1; completed += 1 }
              func result() -> (Int, Int) { (maximum, completed) }
          }
          private let workGate = FRPackageWorkGate.shared
          let counter = WorkCounter()
          await withTaskGroup(of: Void.self) { group in
              for _ in 0..<64 {
                  group.addTask {
                      await workGate.acquire()
                      await counter.enter()
                      await Task.yield()
                      await counter.leave()
                      await workGate.release()
                  }
              }
          }
          let counts = await counter.result()
          precondition(counts.0 == 1 && counts.1 == 64)
          print("PASS: package gate permits exactly one active operation")
          '''
          output = Path(os.environ['RUNNER_TEMP']) / 'xsign_queue_tests.swift'
          output.write_text('import Foundation\n' + model + gate + checks)
          XSIGN_QUEUE_TEST_PY
          swift "$RUNNER_TEMP/xsign_queue_tests.swift"

