      - name: Verify bounded download overlap and install URL encoding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'XSIGN_PIPELINE_TEST_PY'
          import os
          from pathlib import Path
          source = Path('Feather/Views/Sources/SourcesView.swift').read_text()
          models = source[source.index('// MARK: - Serial FIFO download queue'):source.index('// MARK: - Universal IPABlack')]
          checks = r'''
          let updates = XSignDownloadProgressGate()
          var updateCount = 0
          for percent in 0..<100 {
              for _ in 0..<100 { if updates.shouldPublish(percent) { updateCount += 1 } }
          }
          precondition(updateCount == 100 && !updates.shouldPublish(98))
          print("PASS: 10,000 progress events create only 100 UI updates without regression")

          var p = XSignBoundedPipeline<Int, String>()
          precondition(!p.canStartDownload)
          for i in 0..<4 { precondition(p.enqueue(key: "\(i)", job: i)) }
          precondition(p.takeDownload()?.value == 0)
          precondition(p.takeDownload() == nil)
          precondition(!p.completeDownload(key: "other", file: "bad"))
          precondition(p.completeDownload(key: "0", file: "ipa0"))
          precondition(!p.canStartDownload) // one staged file exerts backpressure
          precondition(p.takeProcessing()?.file == "ipa0")
          precondition(!p.enqueue(key: "0", job: 999))
          precondition(p.takeDownload()?.value == 1) // signing 0 overlaps downloading 1
          precondition(p.processing?.job == 0 && p.inFlightCount == 2)
          precondition(!p.finishProcessing(key: "1"))
          precondition(p.completeDownload(key: "1", file: "ipa1"))
          precondition(p.inFlightCount == 2 && p.takeDownload() == nil)
          precondition(p.finishProcessing(key: "0"))
          precondition(p.takeProcessing()?.job == 1)
          precondition(p.takeDownload()?.value == 2)
          precondition(p.failDownload(key: "2"))
          precondition(p.processing?.job == 1) // network failure cannot clear the signing slot
          precondition(p.takeDownload()?.value == 3)
          precondition(p.completeDownload(key: "3", file: "ipa3"))
          precondition(p.finishProcessing(key: "1"))
          precondition(p.takeProcessing()?.job == 3)
          precondition(p.finishProcessing(key: "3"))
          precondition(p.enqueue(key: "2", job: 2)) // an explicit retry may join again
          precondition(p.inFlightCount == 0)
          print("PASS: overlap, one active network transfer, two-package bound, retries and slot ownership")

          var stress = XSignBoundedPipeline<Int, Int>()
          for i in 0..<1024 { precondition(stress.enqueue(key: "\(i)", job: i)) }
          var processingOrder: [Int] = []
          var done = 0
          var seed: UInt64 = 51
          for _ in 0..<50000 {
              seed = seed &* 6364136223846793005 &+ 1
              if let current = stress.activeDownload, (seed & 1) == 0 {
                  precondition(stress.completeDownload(key: current.key, file: current.value))
              }
              if let processing = stress.processing, (seed & 4) == 0 {
                  precondition(stress.finishProcessing(key: processing.key))
                  done += 1
              }
              if let start = stress.takeProcessing() { processingOrder.append(start.job) }
              _ = stress.takeDownload()
              precondition(stress.inFlightCount <= 2)
              if done == 1024 { break }
          }
          precondition(done == 1024 && processingOrder == Array(0..<1024))
          precondition(stress.inFlightCount == 0 && !stress.canStartDownload)
          print("PASS: 1024 jobs retain FIFO processing with variable phase timing and bounded resources")
          '''
          output = Path(os.environ['RUNNER_TEMP']) / 'xsign_bounded_pipeline_tests.swift'
          output.write_text('import Foundation\n' + models + checks)

          compute = Path('Feather/Backend/Server/ServerInstaller+Compute.swift').read_text()
          start = compute.index('    private func _iTunesLink(with url: String)')
          end = compute.index('    @MainActor private static var brandedEndpointUnavailableUntil', start)
          external_start = compute.index('    var externalServerLink: String {')
          external_end = compute.index('\n\tvar iTunesLink:', external_start)
          methods = compute[external_start:external_end] + '\n' + compute[start:end]
          url_checks = r'''
          let instance = InstallURLFixture()
          let external = URLComponents(string: instance.externalServerLink)!
          let externalFields = Dictionary(external.queryItems!.map { ($0.name, $0.value!) }, uniquingKeysWith: { _, b in b })
          precondition(externalFields["name"] == instance.app.name)
          precondition(externalFields["version"] == instance.app.version)
          precondition(externalFields["fetchurl"] == instance.payloadEndpoint.absoluteString)
          let manifest = instance.brandedManifestEndpoint!
          precondition(manifest.host == "x-sign.web.app")
          let fields = Dictionary(URLComponents(url: manifest, resolvingAgainstBaseURL: false)!.queryItems!.map { ($0.name, $0.value!) }, uniquingKeysWith: { _, b in b })
          precondition(fields["title"] == instance.app.name)
          precondition(fields["version"] == "1.0+2")
          precondition(fields["ipa"] == instance.payloadEndpoint.absoluteString)
          let link = URL(string: instance.testLink(manifest.absoluteString))!
          let outer = URLComponents(url: link, resolvingAgainstBaseURL: false)!
          precondition(outer.scheme == "itms-services")
          precondition(outer.queryItems?.first(where: { $0.name == "url" })?.value == manifest.absoluteString)
          print("PASS: Arabic, plus, ampersand and nested URLs survive exactly one encoding layer")
          '''
          fixture = '''
          struct InstallFixtureApp {
              let identifier: String? = "com.xsign.test"
              let version: String? = "1.0+2"
              let name: String? = "تطبيق A+B & X"
          }
          struct InstallURLFixture {
              let app = InstallFixtureApp()
              let payloadEndpoint = URL(string: "https://device.example:7443/a.ipa?x=a%2Bb&token=v%26w")!
              let displayImageSmallEndpoint = URL(string: "https://device.example:7443/icon.png")!
              func testLink(_ url: String) -> String { _iTunesLink(with: url) }
          ''' + methods + '\n}\n'
          (Path(os.environ['RUNNER_TEMP'])/'xsign_install_url_tests.swift').write_text('import Foundation\n' + fixture + url_checks)
          XSIGN_PIPELINE_TEST_PY
          swift "$RUNNER_TEMP/xsign_bounded_pipeline_tests.swift"
          swift "$RUNNER_TEMP/xsign_install_url_tests.swift"
      - name: Bundle a small first-launch catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'XSIGN_SEED_PY'
          import base64
          import json
          import urllib.request
          from pathlib import Path
          
          ROOT = Path.cwd() / 'Feather' / 'Resources'
          ROOT.mkdir(parents=True, exist_ok=True)
          FALLBACK_IPABLACK = base64.b64decode('')
          TARGETS = [
              ('XSignLaunchIPABlack.json', 'https://raw.githubusercontent.com/ipa-black/IPABLACK/refs/heads/main/repo.json'),
              ('XSignLaunchStoreAPI.json', 'https://raw.githubusercontent.com/ipa-black/store-api/main/public/repo.json'),
          ]
          APP_KEYS = {'name', 'bundleIdentifier', 'subtitle', 'localizedDescription', 'developerName',
                      'iconURL', 'downloadURL', 'version', 'size', 'category', 'versions', 'screenshots', 'screenshotURLs', 'skipAppStoreLookup'}
          ROOT_KEYS = {'name', 'identifier', 'iconURL', 'tintColor', 'news', 'subtitle', 'categories'}
          URL_KEYS = {'iconURL', 'website', 'headerURL', 'imageURL', 'url'}
          
          
          def sanitize(value):
              if isinstance(value, dict):
                  return {key: sanitize(item) for key, item in value.items()
                          if not (key in URL_KEYS and isinstance(item, str) and not item.strip())}
              if isinstance(value, list):
                  return [sanitize(item) for item in value]
              return value
          
          
          def preview(raw):
              root = json.loads(raw)
              if not isinstance(root, dict) or not isinstance(root.get('apps'), list) :
                  raise ValueError('Source has no application list')
              result = {key: value for key, value in root.items() if key in ROOT_KEYS}
              if isinstance(result.get('news'), list):
                  result['news'] = result['news'][:2]
              page = []
              for app in root['apps'][:24]:
                  if not isinstance(app, dict):
                      continue
                  item = {key: value for key, value in app.items() if key in APP_KEYS}
                  for key in ['subtitle', 'localizedDescription']:
                      if isinstance(item.get(key), str):
                          item[key] = item[key][:800]
                  if isinstance(item.get('versions'), list):
                      item['versions'] = item['versions'][:1]
                  if isinstance(item.get('screenshotURLs'), list):
                      item['screenshotURLs'] = item['screenshotURLs'][:3]
                  page.append(item)
              while True:
                  result['apps'] = page
                  encoded = json.dumps(sanitize(result), ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()
                  if len(encoded) <= 131_072:
                      return encoded
                  if not page:
                      raise ValueError('Preview metadata exceeds resource limit')
                  if not page:
                      raise ValueError('Preview metadata exceeds resource limit')
                  if not page:
                      raise ValueError('Preview metadata exceeds resource limit')
                  if not page:
                      raise ValueError('Preview metadata exceeds resource limit')
                  page.pop()
              raise ValueError('No bounded launch preview could be created')
          
          
          for name, url in TARGETS:
              destination = ROOT / name
              content = None
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'X-SIGN-Build'})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      content = preview(response.read())
              except Exception as error:
                  print(f'::warning::{name}: using a saved launch preview ({type(error).__name__}).')
              if content is None and destination.is_file():
                  try:
                      content = preview(destination.read_bytes())
                  except (ValueError, TypeError, KeyError):
                      pass
              if content is None and name == 'XSignLaunchIPABlack.json':
                  content = preview(FALLBACK_IPABLACK)
              if content is not None:
                  destination.write_bytes(content)
                  print(f'{name}: {len(json.loads(content)["apps"])} apps, {len(content)} bytes')
          
          if not any(ROOT.glob('XSignLaunch*.json')):
              raise SystemExit('No launch catalog is available to bundle.')
          XSIGN_SEED_PY

