          root = Path.cwd().resolve()
          paths = sorted({name for _, patch in PATCHES for name in re.findall(r"^\+\+\+ b/(.+)$", patch, re.MULTILINE)})
          originals = {}
          for name in paths:
              source = (root / name).resolve()
              if not source.is_relative_to(root) or not source.is_file():
                  raise SystemExit("::error::Missing or invalid source file: " + name)
              originals[name] = source.read_bytes()
          
          # Validate and apply both phases in an isolated copy before touching app files.
          # This supports the original repository, the earlier repair, and repeat runs.
          with tempfile.TemporaryDirectory(prefix="xsign-reviewed-fix-") as folder:
              staging = Path(folder)
              subprocess.run(["git", "init", "--quiet", str(staging)], check=True)
              for name, content in originals.items():
                  target = staging / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
          
              for label, patch in PATCHES:
                  count = 0
                  for part in re.split(r"(?=^diff --git )", patch, flags=re.MULTILINE):
                      if not part.strip():
                          continue
                      forward = subprocess.run(
                          ["git", "apply", "--check", "--whitespace=nowarn", "-"],
                          cwd=staging, input=part, text=True, capture_output=True,
                      )
                      if forward.returncode == 0:
                          subprocess.run(
                              ["git", "apply", "--whitespace=nowarn", "-"],
                              cwd=staging, input=part, text=True, check=True,
                          )
                          count += 1
                          continue
                      reverse = subprocess.run(
                          ["git", "apply", "--reverse", "--check", "--whitespace=nowarn", "-"],
                          cwd=staging, input=part, text=True, capture_output=True,
                      )
                      if reverse.returncode != 0:
                          print(forward.stderr)
                          raise SystemExit("::error::Source context differs from the reviewed version: " + part.splitlines()[0])
                  print(f"{label}: {count} file(s) updated; existing fixes skipped.")
          
              planned = {name: (staging / name).read_bytes() for name in paths}
          
          if any((root / name).read_bytes() != content for name, content in originals.items()):
              raise SystemExit("::error::Source files changed during validation; rerun the workflow.")
          changed = [name for name in paths if planned[name] != originals[name]]
          for name in changed:
              (root / name).write_bytes(planned[name])
          subprocess.run(["git", "diff", "--check"], check=True)
          print(f"Ready: {len(changed)} original Swift file(s) changed.")
          XSIGN_FIX_PY

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.3.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          elif [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi
          xcodebuild -version

      - name: Build and package IPA
        shell: bash
        run: |
          set -euo pipefail
          make 2>&1 | tee "$RUNNER_TEMP/xsign-build.log"
          test -f packages/X-SIGN.ipa

      - name: Save successful fixes in the original files
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            Feather/FeatherApp.swift \
            Feather/Utilities/FR.swift \
            Feather/Views/Library/Info/LibraryInfoView.swift \
            Feather/Views/Library/LibraryView.swift \
            Feather/Views/Settings/Appearance/AppearanceTintColorView.swift \
            Feather/Views/Settings/Appearance/AppearanceView.swift \
            Feather/Views/Settings/SettingsView.swift \
            Feather/Views/Sources/SourcesAddView.swift \
            Feather/Views/Sources/SourcesView.swift \
            Feather/Views/Sources/SourcesViewModel.swift
          if git diff --cached --quiet; then
            echo "Fixes already saved; no duplicate commit needed."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Fix XSign build and connect appearance settings"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XSign-Fixed-IPA
          path: packages/X-SIGN.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XSign-Build-Log
          path: ${{ runner.temp }}/xsign-build.log
          if-no-files-found: ignore
          retention-days: 7
