name: Fix XSign Build Appearance and Startup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsign-build-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-build:
    if: github.ref_type == 'branch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
