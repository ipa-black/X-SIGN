          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          paths = json.loads(Path(".xsign-update-files.json").read_text())
          subprocess.run(["git", "add", "--", *paths], check=True)
          PY
          if git diff --cached --quiet; then
            printf 'Update is already applied.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update XSign launch, dock and bounded downloads"
