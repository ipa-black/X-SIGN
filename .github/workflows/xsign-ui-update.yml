          paths = []
          for item in FILES:
              target = root / item["path"]
              paths.append(item["path"])
              old = target.read_bytes() if target.is_file() else None
              if old is not None and hashlib.sha256(old).hexdigest() == item["result"]:
                  continue

              if "text" in item:
                  new = item["text"].replace(r"\t", "\t").encode("utf-8")
              else:
                  if old is None:
                      raise SystemExit("Missing original file: " + item["path"])
                  lines = old.decode("utf-8").splitlines(keepends=True)
                  for start, end, replacement in reversed(item["edits"]):
                      lines[start:end] = replacement.replace(r"\t", "\t").splitlines(keepends=True)
                  new = "".join(lines).encode("utf-8")

              if hashlib.sha256(new).hexdigest() != item["result"]:
                  raise SystemExit("Copied code does not match the reviewed content: " + item["path"])
              if old == new:
                  continue
              if old is None:
                  if item["base"] is not None:
                      raise SystemExit("Missing original file: " + item["path"])
              else:
                  blob = hashlib.sha1(b"blob " + str(len(old)).encode() + b"\0" + old).hexdigest()
                  if blob != item["base"]:
                      raise SystemExit("File changed since review; no files were overwritten: " + item["path"])
