name: Restore X-SIGN Before All Changes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsign-ui-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore:
    if: github.repository == 'ipa-black/X-SIGN' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main and its history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore the exact original repository files
        shell: bash
        run: |
          set -euo pipefail

          original="ae320f4af04a60746f3c36f7f8724370b4d4d0d2"
          expected_tree="a2b8bd02e7f97c34fb4c59619d22820cd81ed11d"

          parent="$(git rev-parse HEAD)"
          original_tree="$(git rev-parse "$original^{tree}")"

          if [ "$original_tree" != "$expected_tree" ]; then
            printf 'Original snapshot verification failed. Nothing changed.\n' >&2
            exit 1
          fi

          git merge-base --is-ancestor "$original" "$parent"

          if [ "$(git rev-parse "$parent^{tree}")" = "$original_tree" ]; then
            printf 'Repository already matches the original snapshot.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          restored="$(git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$original_tree" -p "$parent" \
            -m "Restore X-SIGN exactly before the launch, dock and download changes")"

          test "$(git rev-parse "$restored^{tree}")" = "$expected_tree"

          git diff --exit-code "$original" "$restored" --

          git push origin "$restored:refs/heads/main"

          remote_head="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$restored"

          printf 'Restored main exactly to the files from %s.\n' \
            "$original" >> "$GITHUB_STEP_SUMMARY"

          printf 'Removed the added XSignLaunch images, update files and installer workflow.\n' \
            >> "$GITHUB_STEP_SUMMARY"

          printf 'Restore commit: %s/%s/commit/%s\n' \
            "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" \
            "$restored" >> "$GITHUB_STEP_SUMMARY"
