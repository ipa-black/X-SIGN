# Run only in ipa-black/X-SIGN, main.
# Replace .github/workflows/XSign_AppStore_Experience.yml with this file.
# No setup workflow is required in IPABLACK or store-api.
# Successful builds save reviewed native files and Tools/XSign_Studio.html in main.
# Install XSign-AppStore-IPA from THIS workflow; the installed app cannot update its code remotely.
name: XSign App Store Experience
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/XSign_AppStore_Experience.yml
permissions:
  contents: write
concurrency:
  group: xsign-appstore-main
  cancel-in-progress: false
jobs:
  fix-and-build:
    if: github.repository == 'ipa-black/X-SIGN' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
    - name: Checkout X-SIGN main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        submodules: recursive
    - name: Select an available Xcode 26 toolchain
      shell: bash
      run: |
        set -euo pipefail
        for app in /Applications/Xcode_26.3.0.app /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.app; do
          if [ -d "$app" ]; then sudo xcode-select -s "$app"; break; fi
        done
        xcodebuild -version
    - name: Install reviewed changes in original Feather files and XSign Studio
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_INSTALL_REVIEWED'
        import base64,hashlib,json,zlib
        from pathlib import Path
        raw=zlib.decompress(base64.b64decode(''))
        assert hashlib.sha256(raw).hexdigest()=='ff32fb51203186b335a2504425129c2181fc6c7b16e02a949caa370df2c72e04', 'Patch payload is damaged'
        files=json.loads(raw); root=Path.cwd().resolve(); changes=[]
        for name,item in files.items():
            path=(root/name).resolve()
            if root not in path.parents: raise SystemExit('Invalid source path')
            if hashlib.sha256(item['content'].encode()).hexdigest()!=item['after']: raise SystemExit('Invalid target digest')
            if path.exists():
                current=hashlib.sha256(path.read_bytes()).hexdigest()
                if current==item['after']: continue
                if current not in item['before']: raise SystemExit('Your changed file was preserved; review required: '+name)
            elif item['before']:
                raise SystemExit('Missing original file: '+name)
            changes.append((path,item['content']))
        for path,content in changes:
            path.parent.mkdir(parents=True,exist_ok=True);path.write_text(content)
        print('Applied reviewed XSign and panel changes to',len(changes),'files.')
        XSIGN_INSTALL_REVIEWED
    - name: Bundle both independent catalogs without changing either source repository
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_BUNDLE_BOTH'
        """Bundle the real full catalog plus a bounded, balanced first screen."""
        import json
        from pathlib import Path
        import urllib.request

        STORE='https://raw.githubusercontent.com/ipa-black/store-api/main/public/repo.json'
        PRIMARY='https://raw.githubusercontent.com/ipa-black/IPABLACK/main/repo.json'
        LIMIT=33_554_432

        def download(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'XSign-Catalog-Bundle'}),timeout=45) as response:
                data=response.read(LIMIT+1)
            if len(data)>LIMIT: raise ValueError('Catalog exceeds the supported size')
            root=json.loads(data)
            if not isinstance(root,dict) or not isinstance(root.get('apps'),list) or not root['apps']:
                raise ValueError('The source is empty or not an AltStore catalog')
            for app in root['apps']:
                if not isinstance(app,dict) or not app.get('bundleIdentifier') or not isinstance(app.get('name'),str):
                    raise ValueError('Incomplete catalog entry; no application was silently discarded')
            return root

        def preview(root):
            def is_game(app):
                key=' '.join(str(app.get(k,'')) for k in ['name','bundleIdentifier','category']).lower()
                return app.get('category')=='games' or any(w in key for w in ['games.','game','puzzle','minecraft','roblox','pool','clash','racing','pubg','لعبة','لعبه'])
            games=[a for a in root['apps'] if is_game(a)]
            apps=[a for a in root['apps'] if not is_game(a)]
            selected=apps[:12]+games[:12]
            used={a['bundleIdentifier'] for a in selected}
            selected += [a for a in root['apps'] if a['bundleIdentifier'] not in used][:24-len(selected)]
            app_keys={'name','bundleIdentifier','version','downloadURL','size','iconURL','category','skipAppStoreLookup','developerName','subtitle','localizedDescription','versions'}
            page=[]
            for app in selected:
                item={k:v for k,v in app.items() if k in app_keys}
                for key in ['subtitle','localizedDescription']:
                    if isinstance(item.get(key),str): item[key]=item[key][:800]
                if isinstance(item.get('versions'),list): item['versions']=item['versions'][:1]
                page.append(item)
            result={k:v for k,v in root.items() if k in ['name','identifier','subtitle','iconURL','tintColor','categories']}
            result['apps']=page
            data=json.dumps(result,ensure_ascii=False,separators=(',',':')).encode()
            if len(data)>131_072: raise ValueError('First screen exceeds its startup budget')
            return data

        def main():
            resources=Path('Feather/Resources');resources.mkdir(parents=True,exist_ok=True)
            primary=download(PRIMARY)
            for title,url,root in [('IPABlack',PRIMARY,primary),('StoreAPI',STORE,download(STORE))]:
                # Store the complete source. A preview is never used as a replacement for the full list.
                encoded=json.dumps(root,ensure_ascii=False,separators=(',',':')).encode()
                (resources/f'XSignCatalog{title}.json').write_bytes(encoded)
                (resources/f'XSignLaunch{title}.json').write_bytes(preview(root))
                print(f'{title}: bundled all {len(root["apps"])} applications, {len(encoded)} bytes')

        if __name__=='__main__': main()
        XSIGN_BUNDLE_BOTH
    - name: Test real source parsing, core configuration, offline indexing and recovery
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_STAGE_CHECKS'
        import os
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])
        (root/'xsign_fixture_server.py').write_text('"""Local-only HTTP fixtures for the real Swift catalog transport tests."""\nfrom http.server import ThreadingHTTPServer,BaseHTTPRequestHandler\nfrom pathlib import Path\nfrom urllib.parse import urlsplit\nimport json,sys,time,threading\n\nlock=threading.Lock()\nstate={\'catalog_requests\':0,\'body_requests\':0,\'broken\':False}\ncatalog=Path(\'Feather/Resources/XSignCatalogStoreAPI.json\').read_bytes()\nclass Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n        path=urlsplit(self.path).path\n        if path==\'/stats\':\n            with lock: body=json.dumps(state).encode()\n            self.send(200,body);return\n        if path==\'/break\':\n            with lock: state[\'broken\']=True\n            self.send(200,b\'{}\');return\n        if path==\'/invalid\': self.send(200,b\'<html>not a source</html>\');return\n        if path!=\'/catalog\': self.send(503,b\'{}\');return\n        with lock:\n            state[\'catalog_requests\']+=1\n            broken=state[\'broken\']\n        time.sleep(.15)\n        if broken: self.send(200,b\'{"apps": "invalid"}\');return\n        if self.headers.get(\'If-None-Match\')==\'"fixture-v1"\':\n            self.send(304,b\'\');return\n        with lock: state[\'body_requests\']+=1\n        self.send(200,catalog,\'"fixture-v1"\')\n    def send(self,status,body,etag=None):\n        self.send_response(status)\n        self.send_header(\'Content-Type\',\'application/json\')\n        self.send_header(\'Content-Length\',str(len(body)))\n        if etag: self.send_header(\'ETag\',etag)\n        self.end_headers()\n        if body:self.wfile.write(body)\n    def log_message(self,*args): pass\n\nserver=ThreadingHTTPServer((\'127.0.0.1\',0),Handler)\nPath(sys.argv[1]).write_text(str(server.server_port))\nserver.serve_forever()\n')
        (root/'xsign_catalog_checks.swift').write_text('@main\nstruct CatalogLoadingTests {\n    @MainActor static func main() async throws {\n        let resources = URL(fileURLWithPath: "Feather/Resources", isDirectory: true)\n        let data = try Data(contentsOf: resources.appendingPathComponent("XSignCatalogStoreAPI.json"))\n        let json = try JSONSerialization.jsonObject(with: data) as! [String: Any]\n        let expected = (json["apps"] as! [[String: Any]]).count\n        precondition(expected > 100, "A preview must never replace the full bundled catalog")\n        let record = try XSignCatalogIO.decode(data)\n        precondition(record.repository.apps.count == expected)\n        print("PASS: the production decoder retains every bundled application (\\(expected))")\n\n        let full = URL(string: "https://raw.githubusercontent.com/ipa-black/store-api/main/public/repo.json")!\n        let blob = URL(string: "https://github.com/ipa-black/store-api/blob/main/public/repo.json")!\n        let refs = URL(string: "https://raw.githubusercontent.com/ipa-black/store-api/refs/heads/main/public/repo.json")!\n        precondition(XSignCatalogIO.canonicalURL(blob) == full)\n        precondition(XSignCatalogIO.canonicalURL(refs) == full)\n        let signed = URL(string: "https://example.org/repo.json?signature=a%2Bb%3D&expires=99")!\n        precondition(XSignCatalogIO.canonicalURL(signed).absoluteString == signed.absoluteString)\n        print("PASS: GitHub page/raw URLs share one identity; signed queries remain intact")\n\n        // A legacy panel that lists only IPA BLACK must not remove Store API.\n        let primaryURL = ProtectedSourcesVault.ipaBlackURLString\n        let primaryOnly = [XSignCoreSourceItem(name: "IPA BLACK", id: "xsign.core.ipablack", url: primaryURL)]\n        let resolved = AppStoreCacheManager.resolvedManagedSources(primaryOnly)\n        precondition(Set(resolved.map(\\.id)) == ["xsign.core.ipablack", "xsign.core.storeapi"])\n        let aliases = primaryOnly + [XSignCoreSourceItem(name: "alias", id: "alias.store", url: refs.absoluteString)]\n        precondition(AppStoreCacheManager.resolvedManagedSources(aliases).count == 2)\n        let extraSource = XSignCoreSourceItem(name: "extra", id: "user.extra", url: "https://example.org/extra.json")\n        precondition(AppStoreCacheManager.resolvedManagedSources(primaryOnly + [extraSource]).count == 3)\n        print("PASS: both independent sources survive legacy panel config; aliases deduplicate; custom sources remain")\n\n        let primaryData = try Data(contentsOf: resources.appendingPathComponent("XSignCatalogIPABlack.json"))\n        let panelRoot = try JSONDecoder().decode(XSignRemoteRoot.self, from: primaryData)\n        precondition(panelRoot.xsign_config != nil)\n        let primary = try XSignCatalogIO.decode(primaryData)\n        let paired = await Task.detached {\n            AppStoreCacheManager.buildSnapshot(snapshot: [\n                (URL(string: primaryURL), "xsign.core.ipablack", primary.repository),\n                (full, "xsign.core.storeapi", record.repository)\n            ], previousItems: [])\n        }.value!\n        precondition(paired.ipablackItems.count == primary.repository.apps.count)\n        precondition(paired.allCombinedItems.count == expected + primary.repository.apps.count)\n        print("PASS: panel schema decodes; Today stays scoped to IPA BLACK while apps/games include both catalogs")\n\n        var sample = (json["apps"] as! [[String: Any]])[0]\n        sample["name"] = "Fixture Utility"; sample["bundleIdentifier"] = "org.fixture.utility"\n        sample["localizedDescription"] = ""; sample["subtitle"] = ""; sample["category"] = "forced_game"\n        let categoryRoot: [String: Any] = ["name": "Fixture", "identifier": "fixture.category", "apps": [sample],\n            "categories": [["id": "forced_game", "name": "ألعاب", "isGame": true]]]\n        let categorized = try XSignCatalogIO.decode(JSONSerialization.data(withJSONObject: categoryRoot)).repository\n        let categorySnapshot = await Task.detached {\n            AppStoreCacheManager.buildSnapshot(snapshot: [(full, "fixture.category", categorized)], previousItems: [])\n        }.value!\n        precondition(categorySnapshot.pureGamesOnly.count == 1)\n        precondition(categorySnapshot.itemsByCategory[.social]?.isEmpty == true)\n        print("PASS: panel game categories affect the store; empty categories do not repeat the full catalog")\n\n        var ticks = 0\n        let heartbeat = Task { @MainActor in\n            while !Task.isCancelled {\n                ticks += 1\n                try? await Task.sleep(nanoseconds: 5_000_000)\n            }\n        }\n        let began = Date()\n        let snapshot = await Task.detached(priority: .userInitiated) {\n            AppStoreCacheManager.buildSnapshot(snapshot: [(full, "xsign.core.storeapi", record.repository)], previousItems: [])\n        }.value!\n        heartbeat.cancel()\n        precondition(ticks > 0, "Catalog work blocked the main actor")\n        precondition(snapshot.allCombinedItems.count == expected)\n        precondition(snapshot.pureAppsOnly.count + snapshot.pureGamesOnly.count == expected)\n        precondition(!snapshot.pureGamesOnly.isEmpty && !snapshot.pureAppsOnly.isEmpty)\n        print("PASS: full background indexing keeps all apps and games; main-actor ticks=\\(ticks), indexing=\\(Date().timeIntervalSince(began))s")\n\n        let secondRecord = try XSignCatalogIO.decode(data)\n        let second = await Task.detached {\n            AppStoreCacheManager.buildSnapshot(snapshot: [(full, "xsign.core.storeapi", secondRecord.repository)], previousItems: snapshot.allCombinedItems)\n        }.value!\n        precondition(snapshot.allCombinedItems.map(\\.id) == second.allCombinedItems.map(\\.id))\n        precondition(snapshot.allCombinedItems.map { $0.app.uuid } == second.allCombinedItems.map { $0.app.uuid })\n        print("PASS: unchanged refresh preserves row identities instead of rebuilding every item")\n\n        let previewData = AppStoreCacheManager.makeLaunchPreview(record.repository)!\n        let preview = try XSignCatalogIO.decode(previewData).repository\n        precondition(preview.apps.count <= 24 && previewData.count <= 131_072)\n        precondition(preview.apps.contains { AppStore2026Category.strictlyClassify(app: $0).isGameCategory })\n        precondition(preview.apps.contains { !AppStore2026Category.strictlyClassify(app: $0).isGameCategory })\n        print("PASS: bounded launch screen contains apps and games without decoding the full catalog on-main")\n\n        let base = URL(string: ProcessInfo.processInfo.environment["XSIGN_FIXTURE_URL"]!)!\n        let catalogURL = base.appendingPathComponent("catalog")\n        let cache = FileManager.default.temporaryDirectory.appendingPathComponent(UUID().uuidString)\n        defer { try? FileManager.default.removeItem(at: cache) }\n        let io = XSignCatalogIO(directory: cache)\n        let counts = try await withThrowingTaskGroup(of: Int.self) { group in\n            for _ in 0..<20 {\n                group.addTask {\n                    let result = try await io.fetch(catalogURL)\n                    return result.repository.apps.count\n                }\n            }\n            var result: [Int] = []\n            for try await count in group { result.append(count) }\n            return result\n        }\n        precondition(counts.count == 20 && counts.allSatisfy { $0 == expected })\n        let (statsData, _) = try await URLSession.shared.data(from: base.appendingPathComponent("stats"))\n        let stats = try JSONSerialization.jsonObject(with: statsData) as! [String: Any]\n        precondition(stats["body_requests"] as? Int == 1)\n        precondition(stats["catalog_requests"] as? Int == 1)\n        print("PASS: twenty concurrent requests cause exactly one catalog download")\n\n        let stored = await io.cached(catalogURL, includeBundled: false)!\n        precondition(stored.repository.apps.count == expected)\n        let revalidated = try await io.fetch(catalogURL)\n        precondition(revalidated.fingerprint == stored.fingerprint)\n        print("PASS: a 304 response uses the validated disk catalog")\n\n        let vm = SourcesViewModel()\n        let source = AltSource(sourceURL: catalogURL, identifier: "fixture.catalog")\n        await vm.fetchSources([source], refresh: true)\n        precondition(vm.isFinished && vm.sources[source]?.apps.count == expected)\n        _ = try await URLSession.shared.data(from: base.appendingPathComponent("break"))\n        do { _ = try await io.fetch(catalogURL); fatalError("Invalid JSON was accepted") }\n        catch { precondition(error is XSignCatalogError) }\n        let retained = await io.cached(catalogURL, includeBundled: false)!\n        precondition(retained.fingerprint == stored.fingerprint)\n        await vm.fetchSources([source], refresh: true)\n        precondition(vm.isFinished && vm.errors[source] != nil)\n        precondition(vm.sources[source]?.apps.count == expected)\n        print("PASS: a broken refresh ends loading, reports an error and preserves every cached app")\n\n        let invalid = AltSource(sourceURL: base.appendingPathComponent("invalid"), identifier: "fixture.invalid")\n        await vm.fetchSources([invalid], refresh: true)\n        precondition(vm.isFinished && vm.sources[invalid] == nil && vm.errors[invalid] != nil)\n        print("PASS: invalid HTML cannot leave a source in an endless loading state")\n        print("All catalog-loading integration checks passed.")\n    }\n}\n')
        (root/'xsign_make_tests.py').write_text('"""Compile the real parser, transport, cache and indexing logic on the Mac runner."""\nfrom pathlib import Path\nimport os\n\nroot=Path.cwd()\nview=(root/\'Feather/Views/Sources/SourcesView.swift\').read_text()\nvm=(root/\'Feather/Views/Sources/SourcesViewModel.swift\').read_text().replace(\'import AltSourceKit\\n\',\'\')\nmodel=(root/\'AltSourceKit/Sources/AltSourceKit/Models/ASRepository.swift\').read_text()\nvault=view[view.index(\'enum ProtectedSourcesVault {\'):view.index(\'// MARK: - Rich Apple App Store Metadata Model\')]\nengine=view[view.index(\'enum AppStoreBilingualEngine {\'):view.index(\'// MARK: - Serial FIFO download queue\')]\nengine=engine.replace(\'private struct XSignCatalogSnapshot:\', \'struct XSignCatalogSnapshot:\')\nengine=engine.replace(\'private nonisolated static func buildSnapshot(\', \'fileprivate nonisolated static func buildSnapshot(\')\nengine=engine.replace(\'private nonisolated static func makeLaunchPreview(\', \'fileprivate nonisolated static func makeLaunchPreview(\')\nsupport=\'\'\'\nimport Foundation\nimport SwiftUI\nimport Combine\nimport CryptoKit\n\n// Only platform-bound context is stubbed. Parser/transport/index code below is extracted unchanged.\nstruct AltSource: Hashable, Sendable { let sourceURL: URL?; let identifier: String? }\nstruct XSignCoreSourceItem: Codable, Equatable, Sendable { let name: String; let id: String; let url: String }\nenum AppStoreTheme { static let oceanBlue = Color.blue }\nactor AppStoreLiveMetadataBridge { static let shared = AppStoreLiveMetadataBridge(); func invalidateCache() {} }\nfunc xsignSafeURL(_ text: String?) -> URL? { text.flatMap { URL(string: $0) } }\nextension Color: Codable {\n    public init(from decoder: Decoder) throws { _ = try decoder.singleValueContainer().decode(String.self); self = .blue }\n    public func encode(to encoder: Encoder) throws { var c = encoder.singleValueContainer(); try c.encode("005BBB") }\n}\nextension Array { subscript(safe index: Int) -> Element? { indices.contains(index) ? self[index] : nil } }\n\'\'\'\napp=(root/\'Feather/FeatherApp.swift\').read_text()\nmodels=app[app.index(\'struct XSignRemoteRoot:\'):app.index(\'// MARK: - مدقق الحماية\')]\nsupport=support.replace(\'struct XSignCoreSourceItem: Codable, Equatable, Sendable { let name: String; let id: String; let url: String }\', \'\')\ntests=Path(os.environ[\'XSIGN_TESTS_FILE\']).read_text()\noutput=Path(os.environ[\'RUNNER_TEMP\'])/\'xsign_catalog_loading_tests.swift\'\noutput.write_text(support+models+\'\\n\'+model+\'\\n\'+vm+\'\\n\'+vault+\'\\n\'+engine+\'\\n\'+tests)\nprint(output)\n')
        XSIGN_STAGE_CHECKS
        export XSIGN_TESTS_FILE="$RUNNER_TEMP/xsign_catalog_checks.swift"
        python3 "$RUNNER_TEMP/xsign_make_tests.py"
        python3 "$RUNNER_TEMP/xsign_fixture_server.py" "$RUNNER_TEMP/xsign-fixture-port" &
        fixture_pid=$!
        trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
        for i in {1..100}; do
          if [ -s "$RUNNER_TEMP/xsign-fixture-port" ]; then break; fi
          sleep 0.1
        done
        export XSIGN_FIXTURE_URL="http://127.0.0.1:$(cat "$RUNNER_TEMP/xsign-fixture-port")"
        xcrun swiftc -swift-version 5 -target "$(uname -m)-apple-macos14.0" -O -parse-as-library "$RUNNER_TEMP/xsign_catalog_loading_tests.swift" -o "$RUNNER_TEMP/xsign_catalog_checks"
        /usr/bin/time -l "$RUNNER_TEMP/xsign_catalog_checks" 2>&1 | tee "$RUNNER_TEMP/xsign-appstore-tests.log"
    - name: Build IPA and verify both complete offline catalogs
      shell: bash
      run: |
        set -euo pipefail
        make 2>&1 | tee "$RUNNER_TEMP/xsign-appstore-build.log"
        test -f packages/X-SIGN.ipa
        python3 - <<'XSIGN_VERIFY_FULL_CATALOGS'
        import json,zipfile
        from pathlib import Path
        with zipfile.ZipFile('packages/X-SIGN.ipa') as ipa:
            for kind in ['Catalog','Launch']:
                for title in ['IPABlack','StoreAPI']:
                    name=f'XSign{kind}{title}.json'
                    expected=Path('Feather/Resources',name).read_bytes()
                    actual=ipa.read('Payload/X-SIGN.app/'+name)
                    assert actual==expected, 'IPA is missing its correct offline source: '+name
                    print(name, len(json.loads(actual)['apps']), 'entries verified inside IPA')
        XSIGN_VERIFY_FULL_CATALOGS
    - name: Save successful original files and Studio in X-SIGN main
      shell: bash
      run: |
        set -euo pipefail
        git diff --check
        git add -- Feather/Views/Sources/SourcesView.swift Feather/Views/Sources/SourcesViewModel.swift Feather/Utilities/FR.swift AltSourceKit/Sources/AltSourceKit/Models/ASRepository.swift Feather/FeatherApp.swift .github/workflows/release.yml Tools/XSign_Studio.html Tools/XSign_Review_AR.md Feather/Resources/XSignCatalogIPABlack.json Feather/Resources/XSignCatalogStoreAPI.json Feather/Resources/XSignLaunchIPABlack.json Feather/Resources/XSignLaunchStoreAPI.json
        if ! git diff --cached --quiet; then
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Connect XSign storefront and Studio with two independent offline catalogs"
          git push origin HEAD:refs/heads/main
        fi
        printf '### XSign build\n\nSaved source commit: `%s`\n\nInstall **XSign-AppStore-IPA** from this run. Studio and the Arabic guide are in **XSign-Studio-and-Guide**.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload the updated XSign IPA
      uses: actions/upload-artifact@v4
      with:
        name: XSign-AppStore-IPA
        path: packages/X-SIGN.ipa
        if-no-files-found: error
        retention-days: 14
    - name: Upload Studio and the Arabic operator guide
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: XSign-Studio-and-Guide
        path: |-
          Tools/XSign_Studio.html
          Tools/XSign_Review_AR.md
        if-no-files-found: ignore
        retention-days: 30
    - name: Upload test and build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: XSign-AppStore-Logs
        path: ${{ runner.temp }}/xsign-appstore-*.log
        if-no-files-found: ignore
        retention-days: 7
