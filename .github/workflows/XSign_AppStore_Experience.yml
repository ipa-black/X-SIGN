        (root/'xsign_ipa_checks.swift').write_text('extension CatalogLoadingTests {\n    static func checkMachOHeaders() throws {\n        let directory = FileManager.default.temporaryDirectory.appendingPathComponent(UUID().uuidString)\n        try FileManager.default.createDirectory(at: directory, withIntermediateDirectories: true)\n        defer { try? FileManager.default.removeItem(at: directory) }\n        func word(_ value: UInt32, little: Bool = true) -> Data {\n            Data((0..<4).map { UInt8(truncatingIfNeeded: value >> ((little ? $0 : 3 - $0) * 8)) })\n        }\n        func thin(_ cryptid: UInt32, wide: Bool = true, little: Bool = true) -> Data {\n            var result = Data()\n            for value in [UInt32](arrayLiteral: wide ? 0xfeedfacf : 0xfeedface, 0x0100000c, 0, 2, 1, wide ? 24 : 20, 0) {\n                result.append(word(value, little: little))\n            }\n            if wide { result.append(word(0, little: little)) }\n            for value in [UInt32](arrayLiteral: wide ? 0x2c : 0x21, wide ? 24 : 20, 0, 0, cryptid) {\n                result.append(word(value, little: little))\n            }\n            if wide { result.append(word(0, little: little)) }\n            return result\n        }\n        let executable = directory.appendingPathComponent("Executable")\n        for wide in [true, false] {\n            for little in [true, false] {\n                for cryptid in [UInt32(0), 1] {\n                    try thin(cryptid, wide: wide, little: little).write(to: executable)\n                    let result = try XSignMachOEncryption.isEncrypted(executable: executable)\n                    precondition(result == (cryptid != 0))\n                }\n            }\n        }\n        let first = thin(0), second = thin(1)\n        var fat = word(0xcafebabe, little: false) + word(2, little: false)\n        let headers: [[UInt32]] = [[0x0100000c, 0, 48, UInt32(first.count), 0], [0x0100000c, 0, UInt32(48 + first.count), UInt32(second.count), 0]]\n        for values in headers {\n            for value in values { fat.append(word(value, little: false)) }\n        }\n        fat.append(first); fat.append(second)\n        try fat.write(to: executable)\n        let fatEncrypted = try XSignMachOEncryption.isEncrypted(executable: executable)\n        precondition(fatEncrypted)\n        for invalid in [Data(), Data("not a Mach-O".utf8), Data(thin(0).prefix(40)), Data(fat.prefix(45))] {\n            try invalid.write(to: executable)\n            do { _ = try XSignMachOEncryption.isEncrypted(executable: executable); fatalError("Invalid Mach-O accepted") }\n            catch is XSignMachOEncryption.InspectionError {}\n        }\n        let payload = directory.appendingPathComponent("Payload")\n        let app = payload.appendingPathComponent("Fixture.app")\n        try FileManager.default.createDirectory(at: app, withIntermediateDirectories: true)\n        let info = try PropertyListSerialization.data(fromPropertyList: ["CFBundleExecutable":"Fixture"], format: .xml, options: 0)\n        try info.write(to: app.appendingPathComponent("Info.plist"))\n        try thin(0).write(to: app.appendingPathComponent("Fixture"))\n        try XSignMachOEncryption.verifyPayload(at: payload)\n        let framework = app.appendingPathComponent("Frameworks/Fixture.framework")\n        try FileManager.default.createDirectory(at: framework, withIntermediateDirectories: true)\n        try info.write(to: framework.appendingPathComponent("Info.plist"))\n        try thin(1).write(to: framework.appendingPathComponent("Fixture"))\n        do { try XSignMachOEncryption.verifyPayload(at: payload); fatalError("Encrypted embedded framework accepted") }\n        catch XSignMachOEncryption.InspectionError.encryptedExecutable {}\n        print("PASS: 32/64-bit and both-endian Mach-O cryptid checks, fat slices, malformed headers and encrypted embedded framework rejection")\n    }\n\n    static func checkIPAProvider(_ base: URL) async throws {\n        let endpoint = base.appendingPathComponent("ipa/success")\n        let query = try XSignIPAProvider.requestURL(endpoint: endpoint, bundleID: "org.fixture.app", name: "تطبيق + Test", appStoreID: "123")\n        precondition(query.absoluteString.contains("%2B"))\n        let provider = XSignIPAProvider(endpoint: endpoint)\n        let file = try await provider.resolve(bundleID: "org.fixture.app", name: "تطبيق + Test", appStoreID: "123")\n        precondition(file.absoluteString == "https://example.org/app.ipa?signature=a%2Bb")\n        do {\n            let forbidden = XSignIPAProvider(endpoint: base.appendingPathComponent("ipa/forbidden"))\n            _ = try await forbidden.resolve(bundleID: "org.fixture.app", name: "تطبيق + Test", appStoreID: "123")\n            fatalError("403 was accepted")\n        } catch XSignIPAProviderError.permissionDenied {}\n        for path in ["missing", "insecure"] {\n            let client = XSignIPAProvider(endpoint: base.appendingPathComponent("ipa/" + path))\n            do { _ = try await client.resolve(bundleID: "org.fixture.app", name: "تطبيق + Test", appStoreID: "123"); fatalError("Unavailable/insecure IPA accepted") }\n            catch is XSignIPAProviderError {}\n        }\n        do { _ = try XSignIPAProvider.decode(Data("<html>not JSON</html>".utf8), status: 200); fatalError("Invalid JSON accepted") }\n        catch XSignIPAProviderError.invalidResponse {}\n        print("PASS: actual provider client encodes Arabic/plus safely, sends no credentials, preserves signed result URLs and reports 403/unavailable/malformed responses")\n    }\n}\n')
        (root/'xsign_make_tests.py').write_text('"""Compile the real parser, transport, cache and indexing logic on the Mac runner."""\nfrom pathlib import Path\nimport os\n\nroot=Path.cwd()\nview=(root/\'Feather/Views/Sources/SourcesView.swift\').read_text()\nvm=(root/\'Feather/Views/Sources/SourcesViewModel.swift\').read_text().replace(\'import AltSourceKit\\n\',\'\')\nmodel=(root/\'AltSourceKit/Sources/AltSourceKit/Models/ASRepository.swift\').read_text()\nvault=view[view.index(\'enum ProtectedSourcesVault {\'):view.index(\'// MARK: - Rich Apple App Store Metadata Model\')]\nengine=view[view.index(\'enum AppStoreBilingualEngine {\'):view.index(\'// MARK: - Serial FIFO download queue\')]\nengine=engine.replace(\'private struct XSignCatalogSnapshot:\', \'struct XSignCatalogSnapshot:\')\nengine=engine.replace(\'private nonisolated static func buildSnapshot(\', \'fileprivate nonisolated static func buildSnapshot(\')\nengine=engine.replace(\'private nonisolated static func makeLaunchPreview(\', \'fileprivate nonisolated static func makeLaunchPreview(\')\nsupport=\'\'\'\nimport Foundation\nimport SwiftUI\nimport Combine\nimport CryptoKit\n\n// Only platform-bound context is stubbed. Parser/transport/index code below is extracted unchanged.\nstruct AltSource: Hashable, Sendable { let sourceURL: URL?; let identifier: String? }\nstruct XSignCoreSourceItem: Codable, Equatable, Sendable { let name: String; let id: String; let url: String }\nenum AppStoreTheme { static let oceanBlue = Color.blue }\nactor AppStoreLiveMetadataBridge { static let shared = AppStoreLiveMetadataBridge(); func invalidateCache() {} }\nfunc xsignSafeURL(_ text: String?) -> URL? { text.flatMap { URL(string: $0) } }\nextension Color: Codable {\n    public init(from decoder: Decoder) throws { _ = try decoder.singleValueContainer().decode(String.self); self = .blue }\n    public func encode(to encoder: Encoder) throws { var c = encoder.singleValueContainer(); try c.encode("005BBB") }\n}\nextension Array { subscript(safe index: Int) -> Element? { indices.contains(index) ? self[index] : nil } }\n\'\'\'\napp=(root/\'Feather/FeatherApp.swift\').read_text()\nmodels=app[app.index(\'struct XSignRemoteRoot:\'):app.index(\'// MARK: - مدقق الحماية\')]\nsupport=support.replace(\'struct XSignCoreSourceItem: Codable, Equatable, Sendable { let name: String; let id: String; let url: String }\', \'\')\ntests=Path(os.environ[\'XSIGN_TESTS_FILE\']).read_text()\ntests+=\'\\n\'+Path(os.environ[\'RUNNER_TEMP\'],\'xsign_ipa_checks.swift\').read_text()\noutput=Path(os.environ[\'RUNNER_TEMP\'])/\'xsign_catalog_loading_tests.swift\'\nsearch=(root/\'Feather/Utilities/XSignSearch.swift\').read_text()\nmetadata=(root/\'Feather/Utilities/XSignAppMetadata.swift\').read_text()\nprovider=(root/\'Feather/Utilities/XSignIPAProvider.swift\').read_text()\nencryption=(root/\'Feather/Utilities/XSignMachOEncryption.swift\').read_text()\noutput.write_text(support+search+\'\\n\'+metadata+\'\\n\'+provider+\'\\n\'+encryption+\'\\n\'+models+\'\\n\'+model+\'\\n\'+vm+\'\\n\'+vault+\'\\n\'+engine+\'\\n\'+tests)\nprint(output)\n')
        (root/'xsign_panel_metadata_checks.cjs').write_text('const assert = require(\'node:assert/strict\');\nconst fs = require(\'node:fs\');\nconst vm = require(\'node:vm\');\nconst html = fs.readFileSync(\'Tools/XSign_Studio.html\', \'utf8\');\nlet script = html.split(\'<script>\')[1].split(\'</script>\')[0];\nconst boot = script.indexOf("$(\'cfg-repo\').value = localStorage");\nassert(boot > 0, \'Missing panel boot boundary\');\nscript = script.slice(0, boot);\nconst elements = new Map();\nconst document = {getElementById(id) {\n  if (!elements.has(id)) elements.set(id, {value:\'\', checked:false, addEventListener(){}});\n  return elements.get(id);\n}};\nconst context = vm.createContext({document, structuredClone, URL, TextEncoder, TextDecoder});\nvm.runInContext(script, context);\nvm.runInContext(`\n  repoData = {apps: [], xsign_config:{security_locks:{lock_bundle_rename:true}}};\n  for (const field of fields) {\n    if (field.type === \'checkbox\') $(field.id).checked = field.value;\n    else $(field.id).value = String(field.value);\n  }\n`, context);\nlet collected = vm.runInContext(\'collect()\', context);\nassert.equal(collected.xsign_config.security_locks.allow_app_metadata_editing, true);\nassert.equal(collected.xsign_config.security_locks.lock_bundle_rename, false);\nvm.runInContext("$(\'sec-lock-rename\').checked=false", context);\ncollected = vm.runInContext(\'collect()\', context);\nassert.equal(collected.xsign_config.security_locks.allow_app_metadata_editing, false);\nassert.equal(collected.xsign_config.security_locks.lock_bundle_rename, true);\nassert.throws(() => vm.runInContext(`C.validate({apps:[],xsign_config:{security_locks:{allow_app_metadata_editing:\'true\'}}})`, context));\nconsole.log(\'PASS: actual panel writes metadata permission and legacy compatibility flags coherently\');\n')

