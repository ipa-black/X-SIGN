# XSign v10 — live catalogs, automatic updates and explicit macOS SDK tests.
# Large catalogs remain pinned in repository history.
name: XSign Native Update v10
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/XSign_AppStore_Experience.yml
  schedule:
  - cron: 17 * * * *
permissions:
  contents: write
concurrency:
  group: xsign-appstore-main
  cancel-in-progress: false
jobs:
  fix-and-build:
    if: github.repository == 'ipa-black/X-SIGN' && github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
    - name: Checkout X-SIGN main
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        submodules: recursive
    - name: Verify XSign v10 live sources and macOS SDK fix
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_RECOVER_REVIEWED_UPDATE'
