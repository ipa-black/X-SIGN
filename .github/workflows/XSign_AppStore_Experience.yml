name: XSign Native Update v12
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/XSign_AppStore_Experience.yml
  schedule:
  - cron: 19 * * * *
permissions:
  contents: write
concurrency:
  group: xsign-appstore-main
  cancel-in-progress: false
jobs:
  fix-and-build:
    if: github.repository == 'ipa-black/X-SIGN' && github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
    - name: Checkout current XSign source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        submodules: recursive
    - name: Install reviewed native changes once
      id: prepare
      shell: bash
