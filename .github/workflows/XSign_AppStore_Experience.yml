# Replace this file in ipa-black/X-SIGN, main. Full original-file changes are embedded.
# Firebase deployment remains separate; the app workflow never changes workflow files.
name: XSign App Store Experience
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/XSign_AppStore_Experience.yml
permissions:
  contents: write
concurrency:
  group: xsign-appstore-main
  cancel-in-progress: false
jobs:
  fix-and-build:
    if: github.repository == 'ipa-black/X-SIGN' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
    - name: Checkout X-SIGN main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        submodules: recursive
    - name: Select an available Xcode 26 toolchain
      shell: bash
      run: |
        set -euo pipefail
        for app in /Applications/Xcode_26.3.0.app /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.app; do
          if [ -d "$app" ]; then sudo xcode-select -s "$app"; break; fi
        done
        xcodebuild -version
    - name: Install verified IPA provider client, reference catalog and faster local imports
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_INSTALL_FINAL'
        import base64,hashlib,json,zlib
        from pathlib import Path
        raw=zlib.decompress(base64.b64decode(''))
        assert hashlib.sha256(raw).hexdigest()=='be88f12e0ed56edb7f1e9c75c5699ce43e32403ec0d82378d8539206ef3cf835', 'Patch payload is damaged'
        files=json.loads(raw); root=Path.cwd().resolve(); changes=[]
        for name,item in files.items():
            if name.startswith('.github/workflows/'): raise SystemExit('Workflow paths are not allowed in the source payload')
            path=(root/name).resolve()
            if root not in path.parents: raise SystemExit('Invalid source path')
            if hashlib.sha256(item['content'].encode()).hexdigest()!=item['after']: raise SystemExit('Invalid target digest')
            if path.exists():
                current=hashlib.sha256(path.read_bytes()).hexdigest()
                if current==item['after']: continue
                if current not in item['before']: raise SystemExit('Your changed file was preserved; review required: '+name)
            elif item['before'] and not item.get('allow_missing', False):
                raise SystemExit('Missing original file: '+name)
            changes.append((path,item['content']))
        for path,content in changes:
            path.parent.mkdir(parents=True,exist_ok=True);path.write_text(content)
        print('Applied reviewed changes to',len(changes),'original files.')

        XSIGN_INSTALL_FINAL
    - name: Bundle the two independent catalogs and supplied reference snapshot
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_BUNDLE_BOTH'
        """Bundle the real full catalog plus a bounded, balanced first screen."""
        import json
        from pathlib import Path
        import urllib.request

        STORE='https://raw.githubusercontent.com/ipa-black/store-api/main/public/repo.json'
        PRIMARY='https://raw.githubusercontent.com/ipa-black/IPABLACK/main/repo.json'
        LIMIT=33_554_432

        def download(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'XSign-Catalog-Bundle'}),timeout=45) as response:
                data=response.read(LIMIT+1)
            if len(data)>LIMIT: raise ValueError('Catalog exceeds the supported size')
            root=json.loads(data)
            if not isinstance(root,dict) or not isinstance(root.get('apps'),list) or not root['apps']:
                raise ValueError('The source is empty or not an AltStore catalog')
            for app in root['apps']:
                if not isinstance(app,dict) or not app.get('bundleIdentifier') or not isinstance(app.get('name'),str):
                    raise ValueError('Incomplete catalog entry; no application was silently discarded')
            return root

        def preview(root):
            def is_game(app):
                key=' '.join(str(app.get(k,'')) for k in ['name','bundleIdentifier','category']).lower()
                return app.get('category')=='games' or any(w in key for w in ['games.','game','puzzle','minecraft','roblox','pool','clash','racing','pubg','لعبة','لعبه'])
            games=[a for a in root['apps'] if is_game(a)]
            apps=[a for a in root['apps'] if not is_game(a)]
            selected=apps[:12]+games[:12]
            used={a['bundleIdentifier'] for a in selected}
            selected += [a for a in root['apps'] if a['bundleIdentifier'] not in used][:24-len(selected)]
            app_keys={'name','bundleIdentifier','version','downloadURL','size','iconURL','category','skipAppStoreLookup','developerName','subtitle','localizedDescription','versions','catalogID'}
            page=[]
            for app in selected:
                item={k:v for k,v in app.items() if k in app_keys}
                for key in ['subtitle','localizedDescription']:
                    if isinstance(item.get(key),str): item[key]=item[key][:800]
                if isinstance(item.get('versions'),list): item['versions']=item['versions'][:1]
                page.append(item)
            result={k:v for k,v in root.items() if k in ['name','identifier','subtitle','iconURL','tintColor','categories']}
            result['apps']=page
            data=json.dumps(result,ensure_ascii=False,separators=(',',':')).encode()
            if len(data)>131_072: raise ValueError('First screen exceeds its startup budget')
            return data

        def main():
            resources=Path('Feather/Resources');resources.mkdir(parents=True,exist_ok=True)
            primary=download(PRIMARY)
            reference=json.loads((resources/'XSignCatalogReference.json').read_text())
            for title,url,root in [('IPABlack',PRIMARY,primary),('StoreAPI',STORE,download(STORE)),('Reference','supplied IPA snapshot',reference)]:
                # Store the complete source. A preview is never used as a replacement for the full list.
                encoded=json.dumps(root,ensure_ascii=False,separators=(',',':')).encode()
                (resources/f'XSignCatalog{title}.json').write_bytes(encoded)
                (resources/f'XSignLaunch{title}.json').write_bytes(preview(root))
                print(f'{title}: bundled all {len(root["apps"])} applications, {len(encoded)} bytes')

        if __name__=='__main__': main()
        XSIGN_BUNDLE_BOTH
    - name: Test provider errors, Mach-O encryption, variants, metadata editing and automatic loading
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_STAGE_CHECKS'
        import os
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])
        (root/'xsign_fixture_server.py').write_text('"""Local-only HTTP fixtures for the real Swift catalog transport tests."""\nfrom http.server import ThreadingHTTPServer,BaseHTTPRequestHandler\nfrom pathlib import Path\nfrom urllib.parse import urlsplit,parse_qs\nimport json,sys,time,threading\n\nlock=threading.Lock()\nstate={\'catalog_requests\':0,\'body_requests\':0,\'broken\':False}\ncatalog=Path(\'Feather/Resources/XSignCatalogStoreAPI.json\').read_bytes()\nclass Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n        path=urlsplit(self.path).path\n        if path.startswith(\'/ipa/\'):\n            if path==\'/ipa/forbidden\': self.send(403,b\'<html>permission required</html>\');return\n            if path==\'/ipa/missing\': self.send(200,b\'{"success":false,"error":"not available"}\');return\n            if path==\'/ipa/insecure\': self.send(200,b\'{"success":true,"download_url":"http://example.org/app.ipa"}\');return\n            query=parse_qs(urlsplit(self.path).query)\n            expected={\'bundleId\':[\'org.fixture.app\'],\'name\':[\'تطبيق + Test\'],\'id\':[\'123\']}\n            if query!=expected or self.headers.get(\'Authorization\'):\n                self.send(400,b\'{"success":false}\');return\n            self.send(200,b\'{"success":true,"download_url":"https://example.org/app.ipa?signature=a%2Bb"}\');return\n        if path==\'/stats\':\n            with lock: body=json.dumps(state).encode()\n            self.send(200,body);return\n        if path==\'/break\':\n            with lock: state[\'broken\']=True\n            self.send(200,b\'{}\');return\n        if path==\'/invalid\': self.send(200,b\'<html>not a source</html>\');return\n        if path!=\'/catalog\': self.send(503,b\'{}\');return\n        with lock:\n            state[\'catalog_requests\']+=1\n            broken=state[\'broken\']\n        time.sleep(.15)\n        if broken: self.send(200,b\'{"apps": "invalid"}\');return\n        if self.headers.get(\'If-None-Match\')==\'"fixture-v1"\':\n            self.send(304,b\'\');return\n        with lock: state[\'body_requests\']+=1\n        self.send(200,catalog,\'"fixture-v1"\')\n    def send(self,status,body,etag=None):\n        self.send_response(status)\n        self.send_header(\'Content-Type\',\'application/json\')\n        self.send_header(\'Content-Length\',str(len(body)))\n        if etag: self.send_header(\'ETag\',etag)\n        self.end_headers()\n        if body:self.wfile.write(body)\n    def log_message(self,*args): pass\n\nserver=ThreadingHTTPServer((\'127.0.0.1\',0),Handler)\nPath(sys.argv[1]).write_text(str(server.server_port))\nserver.serve_forever()\n')
        (root/'xsign_catalog_checks.swift').write_text('@main\nstruct CatalogLoadingTests {\n    @MainActor static func main() async throws {\n        let legacyLocks = try JSONDecoder().decode(XSignSecurityLocks.self, from: Data("{\\"lock_bundle_rename\\":true}".utf8))\n        precondition(legacyLocks.allowsAppMetadataEditing, "Legacy locks must not disable the new user editor")\n        let locked = try JSONDecoder().decode(XSignSecurityLocks.self, from: Data("{\\"allow_app_metadata_editing\\":false}".utf8))\n        precondition(!locked.allowsAppMetadataEditing)\n        let unlocked = try JSONDecoder().decode(XSignSecurityLocks.self, from: Data("{\\"allow_app_metadata_editing\\":true,\\"lock_bundle_rename\\":true}".utf8))\n        precondition(unlocked.allowsAppMetadataEditing)\n        let originalInfo: [String: Any] = ["CFBundleName":"Original", "CFBundleDisplayName":"Original", "CFBundleIdentifier":"com.example.original", "CFBundleShortVersionString":"1.0", "CFBundleVersion":"10", "CFBundleExecutable":"OriginalBinary"]\n        let editedInfo = NSMutableDictionary(dictionary: originalInfo)\n        try XSignAppMetadata.apply(name: " تطبيق حسن ", bundleIdentifier: "com.example.personal", version: "2.3.4", to: editedInfo)\n        let encodedInfo = try PropertyListSerialization.data(fromPropertyList: editedInfo, format: .xml, options: 0)\n        let restoredInfo = try PropertyListSerialization.propertyList(from: encodedInfo, options: [], format: nil) as! [String: Any]\n        precondition(restoredInfo["CFBundleName"] as? String == "تطبيق حسن")\n        precondition(restoredInfo["CFBundleDisplayName"] as? String == "تطبيق حسن")\n        precondition(restoredInfo["CFBundleIdentifier"] as? String == "com.example.personal")\n        precondition(restoredInfo["CFBundleShortVersionString"] as? String == "2.3.4")\n        precondition(restoredInfo["CFBundleVersion"] as? String == "2.3.4")\n        precondition(restoredInfo["CFBundleExecutable"] as? String == "OriginalBinary")\n        let invalidInfo = NSMutableDictionary(dictionary: originalInfo)\n        do {\n            try XSignAppMetadata.apply(name: "Changed", bundleIdentifier: "com.example.good", version: "not-a-version", to: invalidInfo)\n            fatalError("Invalid version was accepted")\n        } catch { precondition(invalidInfo.isEqual(to: originalInfo)) }\n        for bundle in ["", "com..app", "com.example.*", "معرف.تطبيق", "com/example/app"] {\n            precondition(XSignAppMetadata.errorMessage(for: bundle, field: .bundleIdentifier) != nil)\n        }\n        print("PASS: user metadata permission, valid fields and actual Info.plist name/bundle/version round-trip without partial edits")\n\n        let resources = URL(fileURLWithPath: "Feather/Resources", isDirectory: true)\n        let data = try Data(contentsOf: resources.appendingPathComponent("XSignCatalogStoreAPI.json"))\n        let json = try JSONSerialization.jsonObject(with: data) as! [String: Any]\n        let expected = (json["apps"] as! [[String: Any]]).count\n        precondition(expected > 100, "A preview must never replace the full bundled catalog")\n        let record = try XSignCatalogIO.decode(data)\n        precondition(record.repository.apps.count == expected)\n        print("PASS: the production decoder retains every bundled application (\\(expected))")\n\n        let full = URL(string: "https://raw.githubusercontent.com/ipa-black/store-api/main/public/repo.json")!\n        let blob = URL(string: "https://github.com/ipa-black/store-api/blob/main/public/repo.json")!\n        let refs = URL(string: "https://raw.githubusercontent.com/ipa-black/store-api/refs/heads/main/public/repo.json")!\n        precondition(XSignCatalogIO.canonicalURL(blob) == full)\n        precondition(XSignCatalogIO.canonicalURL(refs) == full)\n        let signed = URL(string: "https://example.org/repo.json?signature=a%2Bb%3D&expires=99")!\n        precondition(XSignCatalogIO.canonicalURL(signed).absoluteString =