# One focused fix for the missing/stuck store catalog.
# 1. Upload this file to .github/workflows/XSign_AppStore_Experience.yml in ipa-black/IPABLACK (main).
# 2. After it succeeds, upload the SAME file at the SAME path in ipa-black/X-SIGN (main).
# 3. Install XSign-Catalog-Fixed-IPA from the X-SIGN run. The installed old app cannot receive native-code fixes remotely.
# Preserves signing, appearance, domain, deployment target and existing application records.
name: XSign App Store Experience
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/XSign_AppStore_Experience.yml
permissions:
  contents: write
concurrency:
  group: xsign-catalog-loading-${{ github.repository }}
  cancel-in-progress: false
jobs:
  enable-catalog:
    if: github.repository == 'ipa-black/IPABLACK' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Enable the existing Store API without changing apps or other settings
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_ENABLE_CATALOG'
        """Restore the existing Store API catalog without rewriting apps or admin settings."""
        from copy import deepcopy
        import json
        from pathlib import Path
        import subprocess
        import urllib.request

        SOURCE = {
            'name': 'IPA BLACK',
            'id': 'xsign.core.storeapi',
            'url': 'https://raw.githubusercontent.com/ipa-black/store-api/main/public/repo.json',
        }
        COMPACT_KEYS = ['name', 'identifier', 'subtitle', 'description', 'iconURL', 'tintColor',
                        'repo_revision_id', 'xsign_config', 'categories']

        def canonical(url):
            return url.replace('/refs/heads/main/', '/main/').rstrip('/')

        def repair(data):
            if not isinstance(data, dict) or not isinstance(data.get('apps'), list):
                raise ValueError('repo.json must contain an application list')
            result = deepcopy(data)
            config = result.setdefault('xsign_config', {})
            control = config.setdefault('app_control', {})
            sources = control.setdefault('core_sources', [{
                'name': 'IPA BLACK', 'id': 'xsign.core.ipablack',
                'url': 'https://raw.githubusercontent.com/ipa-black/IPABLACK/refs/heads/main/repo.json',
            }])
            if not isinstance(sources, list) or any(not isinstance(item, dict) for item in sources):
                raise ValueError('core_sources must be a list of source objects')
            matching = [item for item in sources if item.get('id') == SOURCE['id']]
            if any(canonical(str(item.get('url', ''))) != canonical(SOURCE['url']) for item in matching):
                raise ValueError('The original Store API identifier is used by another URL; no overwrite was attempted')
            present = any(canonical(str(item.get('url', ''))) == canonical(SOURCE['url']) for item in sources)
            if not present:
                sources.append(deepcopy(SOURCE))
                result['repo_revision_id'] = int(result.get('repo_revision_id', 0)) + 1
            projection = {key: deepcopy(result[key]) for key in COMPACT_KEYS if key in result}
            return result, projection

        def verify_upstream():
            request = urllib.request.Request(SOURCE['url'], headers={'User-Agent': 'XSign-Catalog-Repair'})
            with urllib.request.urlopen(request, timeout=45) as response:
                content = response.read(16_777_217)
            if len(content) > 16_777_216:
                raise ValueError('Catalog exceeds the supported size')
            upstream = json.loads(content)
            if not isinstance(upstream, dict) or not isinstance(upstream.get('apps'), list) or not upstream['apps']:
                raise ValueError('The existing Store API catalog is unavailable or empty')
            print('Verified existing Store API entries:', len(upstream['apps']))

        def git(*args, check=True):
            return subprocess.run(['git', *args], check=check, text=True, capture_output=True)

        def publish():
            verify_upstream()
            git('config', 'user.name', 'github-actions[bot]')
            git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
            for attempt in range(3):
                git('fetch', 'origin', 'main')
                # This is the workflow's isolated checkout. Re-read main on every retry
                # so a concurrent panel edit is preserved by the next generated commit.
                git('reset', '--hard', 'FETCH_HEAD')
                path = Path('repo.json')
                data, projection = repair(json.loads(path.read_text()))
                path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
                Path('xsign-config.json').write_text(json.dumps(projection, ensure_ascii=False, indent=2) + '\n')
                git('add', '--', 'repo.json', 'xsign-config.json')
                if git('diff', '--cached', '--quiet', check=False).returncode == 0:
                    print('Original Store API is already enabled; no duplicate commit.')
                    return
                git('diff', '--cached', '--check')
                git('commit', '-m', 'Restore existing Store API source and preserve IPA BLACK catalog settings')
                pushed = git('push', 'origin', 'HEAD:refs/heads/main', check=False)
                if pushed.returncode == 0:
                    print('Enabled Store API in the IPA BLACK configuration. Each catalog remains in its own repository.')
                    return
                if not any(term in pushed.stderr for term in ['non-fast-forward', 'fetch first', '[rejected]']):
                    raise RuntimeError(pushed.stderr)
            raise RuntimeError('Main changed during all three attempts; no remote changes were overwritten')

        if __name__ == '__main__':
            publish()
        XSIGN_ENABLE_CATALOG
    - name: Next step
      run: |
        echo "The existing Store API is enabled in main."
        echo "Upload this same workflow to ipa-black/X-SIGN/.github/workflows/XSign_AppStore_Experience.yml, then install the new IPA from that run."
  fix-and-build:
    if: github.repository == 'ipa-black/X-SIGN' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        submodules: recursive
    - name: Install focused loading fixes into the original files
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_LOADING_FIX'
        import base64,hashlib,json,zlib
        from pathlib import Path

        raw=zlib.decompress(base64.b64decode(''))
        assert hashlib.sha256(raw).hexdigest()=='c38859c9a90189258434cfcb80f2bc6b5f7bf3fad26f0ef421fb8e72c5088ac3', 'Patch payload is damaged'
        files=json.loads(raw)
        changes=[]
        root=Path.cwd().resolve()
        for name,item in files.items():
            path=(root/name).resolve()
            if root not in path.parents: raise SystemExit('Invalid patch path')
            if not path.is_file(): raise SystemExit('Missing original file: '+name)
            current=hashlib.sha256(path.read_bytes()).hexdigest()
            if current==item['after']: continue
            if current!=item['before']:
                raise SystemExit('Original file changed; your edits were preserved: '+name)
            if hashlib.sha256(item['content'].encode()).hexdigest()!=item['after']: raise SystemExit('Invalid target digest')
            changes.append((path,item['content']))
        for path,content in changes: path.write_text(content)
        print('Applied focused catalog-loading fixes to',len(changes),'original files.')
        XSIGN_LOADING_FIX
    - name: Bundle the complete current catalog and a small first screen
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_BUNDLE_FULL_CATALOG'
        """Bundle the real full catalog plus a bounded, balanced first screen."""
        import json
        from pathlib import Path
        import urllib.request

        STORE='https://raw.githubusercontent.com/ipa-black/store-api/main/public/repo.json'
        PRIMARY='https://raw.githubusercontent.com/ipa-black/IPABLACK/main/repo.json'
        LIMIT=33_554_432

        def download(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'XSign-Catalog-Bundle'}),timeout=45) as response:
                data=response.read(LIMIT+1)
            if len(data)>LIMIT: raise ValueError('Catalog exceeds the supported size')
            root=json.loads(data)
            if not isinstance(root,dict) or not isinstance(root.get('apps'),list) or not root['apps']:
                raise ValueError('The source is empty or not an AltStore catalog')
            for app in root['apps']:
                if not isinstance(app,dict) or not app.get('bundleIdentifier') or not isinstance(app.get('name'),str):
                    raise ValueError('Incomplete catalog entry; no application was silently discarded')
            return root

        def preview(root):
            def is_game(app):
                key=' '.join(str(app.get(k,'')) for k in ['name','bundleIdentifier','category']).lower()
                return app.get('category')=='games' or any(w in key for w in ['games.','game','puzzle','minecraft','roblox','pool','clash','racing','pubg','لعبة','لعبه'])
            games=[a for a in root['apps'] if is_game(a)]
            apps=[a for a in root['apps'] if not is_game(a)]
            selected=apps[:12]+games[:12]
            used={a['bundleIdentifier'] for a in selected}
            selected += [a for a in root['apps'] if a['bundleIdentifier'] not in used][:24-len(selected)]
            app_keys={'name','bundleIdentifier','version','downloadURL','size','iconURL','category','skipAppStoreLookup','developerName','subtitle','localizedDescription','versions'}
            page=[]
            for app in selected:
                item={k:v for k,v in app.items() if k in app_keys}
                for key in ['subtitle','localizedDescription']:
                    if isinstance(item.get(key),str): item[key]=item[key][:800]
                if isinstance(item.get('versions'),list): item['versions']=item['versions'][:1]
                page.append(item)
            result={k:v for k,v in root.items() if k in ['name','identifier','subtitle','iconURL','tintColor','categories']}
            result['apps']=page
            data=json.dumps(result,ensure_ascii=False,separators=(',',':')).encode()
            if len(data)>131_072: raise ValueError('First screen exceeds its startup budget')
            return data

        def main():
            resources=Path('Feather/Resources');resources.mkdir(parents=True,exist_ok=True)
            primary=download(PRIMARY)
            configured=primary.get('xsign_config',{}).get('app_control',{}).get('core_sources',[])
            if not any(item.get('url','').replace('/refs/heads/','/')==STORE for item in configured):
                raise ValueError('Run this workflow in ipa-black/IPABLACK first to enable the existing store-api source')
            for title,url,root in [('IPABlack',PRIMARY,primary),('StoreAPI',STORE,download(STORE))]:
                # Store the complete source. A preview is never used as a replacement for the full list.
                encoded=json.dumps(root,ensure_ascii=False,separators=(',',':')).encode()
                (resources/f'XSignCatalog{title}.json').write_bytes(encoded)
                (resources/f'XSignLaunch{title}.json').write_bytes(preview(root))
                print(f'{title}: bundled all {len(root["apps"])} applications, {len(encoded)} bytes')

        if __name__=='__main__': main()
        XSIGN_BUNDLE_FULL_CATALOG
    - name: Test real catalog decoding, offline data, request coalescing and failure recovery
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_STAGE_TESTS'
        import os
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])
        (root/'xsign_fixture_server.py').write_text('"""Local-only HTTP fixtures for the real Swift catalog transport tests."""\nfrom http.server import ThreadingHTTPServer,BaseHTTPRequestHandler\nfrom pathlib import Path\nfrom urllib.parse import urlsplit\nimport json,sys,time,threading\n\nlock=threading.Lock()\nstate={\'catalog_requests\':0,\'body_requests\':0,\'broken\':False}\ncatalog=Path(\'Feather/Resources/XSignCatalogStoreAPI.json\').read_bytes()\nclass Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n        path=urlsplit(self.path).path\n        if path==\'/stats\':\n            with lock: body=json.dumps(state).encode()\n            self.send(200,body);return\n        if path==\'/break\':\n            with lock: state[\'broken\']=True\n            self.send(200,b\'{}\');return\n        if path==\'/invalid\': self.send(200,b\'<html>not a source</html>\');return\n        if path!=\'/catalog\': self.send(503,b\'{}\');return\n        with lock:\n            state[\'catalog_requests\']+=1\n            broken=state[\'broken\']\n        time.sleep(.15)\n        if broken: self.send(200,b\'{"apps": "invalid"}\');return\n        if self.headers.get(\'If-None-Match\')==\'"fixture-v1"\':\n            self.send(304,b\'\');return\n        with lock: state[\'body_requests\']+=1\n        self.send(200,catalog,\'"fixture-v1"\')\n    def send(self,status,body,etag=None):\n        self.send_response(status)\n        self.send_header(\'Content-Type\',\'application/json\')\n        self.send_header(\'Content-Length\',str(len(body)))\n        if etag: self.send_header(\'ETag\',etag)\n        self.end_headers()\n        if body:self.wfile.write(body)\n    def log_message(self,*args): pass\n\nserver=ThreadingHTTPServer((\'127.0.0.1\',0),Handler)\nPath(sys.argv[1]).write_text(str(server.server_port))\nserver.serve_forever()\n')
        (root/'xsign_catalog_checks.swift').write_text('@main\nstruct CatalogLoadingTests {\n    @MainActor static func main() async throws {\n        let resources = URL(fileURLWithPath: "Feather/Resources", isDirectory: true)\n        let data = try Data(contentsOf: resources.appendingPathComponent("XSignCatalogStoreAPI.json"))\n        let json = try JSONSerialization.jsonObject(with: data) as! [String: Any]\n        let expected = (json["apps"] as! [[String: Any]]).count\n        precondition(expected > 100, "A preview must never replace the full bundled catalog")\n        let record = try XSignCatalogIO.decode(data)\n        precondition(record.repository.apps.count == expected)\n        print("PASS: the production decoder retains every bundled application (\\(expected))")\n\n        let full = URL(string: "https://raw.githubusercontent.com/ipa-black/store-api/main/public/repo.json")!\n        let blob = URL(string: "https://github.com/ipa-black/store-api/blob/main/public/repo.json")!\n        let refs = URL(string: "https://raw.githubusercontent.com/ipa-black/store-api/refs/heads/main/public/repo.json")!\n        precondition(XSignCatalogIO.canonicalURL(blob) == full)\n        precondition(XSignCatalogIO.canonicalURL(refs) == full)\n        let signed = URL(string: "https://example.org/repo.json?signature=a%2Bb%3D&expires=99")!\n        precondition(XSignCatalogIO.canonicalURL(signed).absoluteString == signed.absoluteString)\n        print("PASS: GitHub page/raw URLs share one identity; signed queries remain intact")\n\n        var ticks = 0\n        let heartbeat = Task { @MainActor in\n            while !Task.isCancelled {\n                ticks += 1\n                try? await Task.sleep(nanoseconds: 5_000_000)\n            }\n        }\n        let began = Date()\n        let snapshot = await Task.detached(priority: .userInitiated) {\n            AppStoreCacheManager.buildSnapshot(snapshot: [(full, "xsign.core.storeapi", record.repository)], previousItems: [])\n        }.value!\n        heartbeat.cancel()\n        precondition(ticks > 0, "Catalog work blocked the main actor")\n        precondition(snapshot.allCombinedItems.count == expected)\n        precondition(snapshot.pureAppsOnly.count + snapshot.pureGamesOnly.count == expected)\n        precondition(!snapshot.pureGamesOnly.isEmpty && !snapshot.pureAppsOnly.isEmpty)\n        print("PASS: full background indexing keeps all apps and games; main-actor ticks=\\(ticks), indexing=\\(Date().timeIntervalSince(began))s")\n\n        let secondRecord = try XSignCatalogIO.decode(data)\n        let second = await Task.detached {\n            AppStoreCacheManager.buildSnapshot(snapshot: [(full, "xsign.core.storeapi", secondRecord.repository)], previousItems: snapshot.allCombinedItems)\n        }.value!\n        precondition(snapshot.allCombinedItems.map(\\.id) == second.allCombinedItems.map(\\.id))\n        precondition(snapshot.allCombinedItems.map { $0.app.uuid } == second.allCombinedItems.map { $0.app.uuid })\n        print("PASS: unchanged refresh preserves row identities instead of rebuilding every item")\n\n        let previewData = AppStoreCacheManager.makeLaunchPreview(record.repository)!\n        let preview = try XSignCatalogIO.decode(previewData).repository\n        precondition(preview.apps.count <= 24 && previewData.count <= 131_072)\n        precondition(preview.apps.contains { AppStore2026Category.strictlyClassify(app: $0).isGameCategory })\n        precondition(preview.apps.contains { !AppStore2026Category.strictlyClassify(app: $0).isGameCategory })\n        print("PASS: bounded launch screen contains apps and games without decoding the full catalog on-main")\n\n        let base = URL(string: ProcessInfo.processInfo.environment["XSIGN_FIXTURE_URL"]!)!\n        let catalogURL = base.appendingPathComponent("catalog")\n        let cache = FileManager.default.temporaryDirectory.appendingPathComponent(UUID().uuidString)\n        defer { try? FileManager.default.removeItem(at: cache) }\n        let io = XSignCatalogIO(directory: cache)\n        let counts = try await withThrowingTaskGroup(of: Int.self) { group in\n            for _ in 0..<20 {\n                group.addTask {\n                    let result = try await io.fetch(catalogURL)\n                    return result.repository.apps.count\n                }\n            }\n            var result: [Int] = []\n            for try await count in group { result.append(count) }\n            return result\n        }\n        precondition(counts.count == 20 && counts.allSatisfy { $0 == expected })\n        let (statsData, _) = try await URLSession.shared.data(from: base.appendingPathComponent("stats"))\n        let stats = try JSONSerialization.jsonObject(with: statsData) as! [String: Any]\n        precondition(stats["body_requests"] as? Int == 1)\n        precondition(stats["catalog_requests"] as? Int == 1)\n        print("PASS: twenty concurrent requests cause exactly one catalog download")\n\n        let stored = await io.cached(catalogURL, includeBundled: false)!\n        precondition(stored.repository.apps.count == expected)\n        let revalidated = try await io.fetch(catalogURL)\n        precondition(revalidated.fingerprint == stored.fingerprint)\n        print("PASS: a 304 response uses the validated disk catalog")\n\n        let vm = SourcesViewModel()\n        let source = AltSource(sourceURL: catalogURL, identifier: "fixture.catalog")\n        await vm.fetchSources([source], refresh: true)\n        precondition(vm.isFinished && vm.sources[source]?.apps.count == expected)\n        _ = try await URLSession.shared.data(from: base.appendingPathComponent("break"))\n        do { _ = try await io.fetch(catalogURL); fatalError("Invalid JSON was accepted") }\n        catch { precondition(error is XSignCatalogError) }\n        let retained = await io.cached(catalogURL, includeBundled: false)!\n        precondition(retained.fingerprint == stored.fingerprint)\n        await vm.fetchSources([source], refresh: true)\n        precondition(vm.isFinished && vm.errors[source] != nil)\n        precondition(vm.sources[source]?.apps.count == expected)\n        print("PASS: a broken refresh ends loading, reports an error and preserves every cached app")\n\n        let invalid = AltSource(sourceURL: base.appendingPathComponent("invalid"), identifier: "fixture.invalid")\n        await vm.fetchSources([invalid], refresh: true)\n        precondition(vm.isFinished && vm.sources[invalid] == nil && vm.errors[invalid] != nil)\n        print("PASS: invalid HTML cannot leave a source in an endless loading state")\n        print("All catalog-loading integration checks passed.")\n    }\n}\n')
        (root/'xsign_make_tests.py').write_text('"""Compile the real parser, transport, cache and indexing logic on the Mac runner."""\nfrom pathlib import Path\nimport os\n\nroot=Path.cwd()\nview=(root/\'Feather/Views/Sources/SourcesView.swift\').read_text()\nvm=(root/\'Feather/Views/Sources/SourcesViewModel.swift\').read_text().replace(\'import AltSourceKit\\n\',\'\')\nmodel=(root/\'AltSourceKit/Sources/AltSourceKit/Models/ASRepository.swift\').read_text()\nvault=view[view.index(\'enum ProtectedSourcesVault {\'):view.index(\'// MARK: - Rich Apple App Store Metadata Model\')]\nengine=view[view.index(\'enum AppStoreBilingualEngine {\'):view.index(\'// MARK: - Serial FIFO download queue\')]\nengine=engine.replace(\'private struct XSignCatalogSnapshot:\', \'struct XSignCatalogSnapshot:\')\nengine=engine.replace(\'private nonisolated static func buildSnapshot(\', \'fileprivate nonisolated static func buildSnapshot(\')\nengine=engine.replace(\'private nonisolated static func makeLaunchPreview(\', \'fileprivate nonisolated static func makeLaunchPreview(\')\nsupport=\'\'\'\nimport Foundation\nimport SwiftUI\nimport Combine\nimport CryptoKit\n\n// Only platform-bound context is stubbed. Parser/transport/index code below is extracted unchanged.\nstruct AltSource: Hashable, Sendable { let sourceURL: URL?; let identifier: String? }\nstruct XSignCoreSourceItem: Codable, Equatable, Sendable { let name: String; let id: String; let url: String }\nenum AppStoreTheme { static let oceanBlue = Color.blue }\nactor AppStoreLiveMetadataBridge { static let shared = AppStoreLiveMetadataBridge(); func invalidateCache() {} }\nfunc xsignSafeURL(_ text: String?) -> URL? { text.flatMap { URL(string: $0) } }\nextension Color: Codable {\n    public init(from decoder: Decoder) throws { _ = try decoder.singleValueContainer().decode(String.self); self = .blue }\n    public func encode(to encoder: Encoder) throws { var c = encoder.singleValueContainer(); try c.encode("005BBB") }\n}\nextension Array { subscript(safe index: Int) -> Element? { indices.contains(index) ? self[index] : nil } }\n\'\'\'\ntests=Path(os.environ[\'XSIGN_TESTS_FILE\']).read_text()\noutput=Path(os.environ[\'RUNNER_TEMP\'])/\'xsign_catalog_loading_tests.swift\'\noutput.write_text(support+model+\'\\n\'+vm+\'\\n\'+vault+\'\\n\'+engine+\'\\n\'+tests)\nprint(output)\n')
        XSIGN_STAGE_TESTS
        export XSIGN_TESTS_FILE="$RUNNER_TEMP/xsign_catalog_checks.swift"
        python3 "$RUNNER_TEMP/xsign_make_tests.py"
        python3 "$RUNNER_TEMP/xsign_fixture_server.py" "$RUNNER_TEMP/xsign-fixture-port" &
        fixture_pid=$!
        trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
        for i in {1..100}; do
          if [ -s "$RUNNER_TEMP/xsign-fixture-port" ]; then break; fi
          sleep 0.1
        done
        export XSIGN_FIXTURE_URL="http://127.0.0.1:$(cat "$RUNNER_TEMP/xsign-fixture-port")"
        swiftc -swift-version 5 -O -parse-as-library "$RUNNER_TEMP/xsign_catalog_loading_tests.swift" -o "$RUNNER_TEMP/xsign_catalog_checks"
        /usr/bin/time -l "$RUNNER_TEMP/xsign_catalog_checks" 2>&1 | tee "$RUNNER_TEMP/xsign-catalog-tests.log"
    - name: Build and verify the IPA contains the full offline catalog
      shell: bash
      run: |
        set -euo pipefail
        make 2>&1 | tee "$RUNNER_TEMP/xsign-catalog-build.log"
        test -f packages/X-SIGN.ipa
        test -f _build/Payload/X-SIGN.app/XSignCatalogStoreAPI.json
        test -f _build/Payload/X-SIGN.app/XSignLaunchStoreAPI.json
        python3 - <<'XSIGN_VERIFY_BUNDLE'
        import json
        from pathlib import Path
        for title in ['StoreAPI','IPABlack']:
            expected=Path(f'Feather/Resources/XSignCatalog{title}.json').read_bytes()
            actual=Path(f'_build/Payload/X-SIGN.app/XSignCatalog{title}.json').read_bytes()
            assert actual==expected, 'Built app is missing its complete offline catalog'
            print(title,'verified in built IPA:',len(json.loads(actual)['apps']),'apps')
        XSIGN_VERIFY_BUNDLE
    - name: Save successful fixes and full catalog snapshots in main
      shell: bash
      run: |
        set -euo pipefail
        git diff --check
        git add -- Feather/Views/Sources/SourcesViewModel.swift \
        +  Feather/Views/Sources/SourcesView.swift \
        +  Feather/Utilities/FR.swift \
        +  AltSourceKit/Sources/AltSourceKit/Models/ASRepository.swift \
        +  Feather/Resources/XSignCatalogIPABlack.json \
        +  Feather/Resources/XSignLaunchIPABlack.json \
        +  Feather/Resources/XSignCatalogStoreAPI.json \
        +  Feather/Resources/XSignLaunchStoreAPI.json
        if git diff --cached --quiet; then
          echo "Catalog fixes are already saved; no duplicate commit needed."
        else
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Show cached catalogs immediately and keep store refresh off the main thread"
          git push origin HEAD:refs/heads/main
        fi
    - name: Upload the new IPA
      uses: actions/upload-artifact@v4
      with:
        name: XSign-Catalog-Fixed-IPA
        path: packages/X-SIGN.ipa
        if-no-files-found: error
        retention-days: 14
    - name: Upload test and build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: XSign-Catalog-Logs
        path: ${{ runner.temp }}/xsign-catalog-*.log
        if-no-files-found: ignore
        retention-days: 7
