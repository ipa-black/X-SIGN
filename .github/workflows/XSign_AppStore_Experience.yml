            patch_id='30e28a61dcfcf7f9c3fdd78ebaaacb655bb7f1db53eb66abc8fd4afeea3a5435'
            if hashlib.sha256(raw).hexdigest()!=patch_id:raise SystemExit('Update integrity failed')
            root=root.resolve();marker=root/'Tools/XSign_V12_Installed.json'
            if marker.exists():
                try:installed=json.loads(marker.read_text())
                except (ValueError,OSError):installed={}
                if installed.get('patch_id')==patch_id:
                    print('XSign v12 already installed; keeping current original source edits')
                    return
            payload=json.loads(raw);ready={};deleted=[]
            for name,item in payload.items():
                path=root/name
                if name.startswith(('/', '.github/')) or '..' in Path(name).parts or not path.resolve().is_relative_to(root):raise SystemExit('Invalid update path')
                current=path.read_bytes() if path.is_file() else None
                digest=hashlib.sha256(current).hexdigest() if current is not None else None
                if item.get('delete'):
                    if current is None:continue
                    if hashlib.sha1(b'blob '+str(len(current)).encode()+b'\0'+current).hexdigest()!=item['before_blob']:raise SystemExit('Preserved an unknown edit: '+name)
                    deleted.append(path);continue
                if digest==item['after']:continue
                if digest!=item['before']:raise SystemExit('Preserved an unknown edit: '+name)
                if 'edits' in item:
                    lines=current.decode().splitlines(keepends=True)
                    for start,end,content in reversed(item['edits']):lines[start:end]=content.splitlines(keepends=True)
                    value=''.join(lines).encode()
                else:value=item['content'].encode()
                if hashlib.sha256(value).hexdigest()!=item['after']:raise SystemExit('Target digest failed: '+name)
                ready[path]=value
            for path,value in ready.items():
                path.parent.mkdir(parents=True,exist_ok=True)
                temp=path.with_name(path.name+'.xsign-update-tmp');temp.write_bytes(value);os.replace(temp,path)
            for path in deleted:path.unlink()
            marker.parent.mkdir(parents=True,exist_ok=True)
            marker.write_text(json.dumps({'version':12,'patch_id':patch_id},indent=2)+'\n')
            print('Installed',len(ready),'reviewed files; removed',len(deleted),'obsolete App Store download files')

        if __name__=='__main__':install()

        XSIGN_INSTALL_V12
    - name: Select Xcode 26
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XCODE'
        from pathlib import Path
        import re,subprocess
        apps=list(Path('/Applications').glob('Xcode*.app'))
        def version(p): return tuple(int(n) for n in re.findall(r'\d+',p.name))
        for app in sorted(apps,key=version,reverse=True):
         if version(app) and version(app)[0]>=26:
          subprocess.run(['sudo','xcode-select','--switch',str(app/'Contents/Developer')],check=True);break
        else: raise SystemExit('An Xcode 26 toolchain is required')
        XCODE
        xcodebuild -version
    - name: Test source conversion, updater, cache and signing
      id: checks
      shell: bash
      run: |
        set -euo pipefail
        {
        set -euo pipefail
        trap 'xs_status=$?; printf "::error::XSign checks stopped at line %s (exit %s)\n" "$LINENO" "$xs_status"; exit "$xs_status"' ERR
        sdk="$(xcrun --sdk macosx --show-sdk-path)"
        compiler="$(xcrun --sdk macosx --find swiftc)"
        target="$(uname -m)-apple-macosx13.0"
        {
          xcodebuild -version
          "$compiler" --version
          printf 'SDK: %s\nTarget: %s\n' "$sdk" "$target"
        } 2>&1 | tee "$RUNNER_TEMP/xsign-appstore-toolchain.log"
        python3 Tools/Tests/prepare_catalog_fixture.py
        python3 Tools/Prepare_Zsign.py
        python3 Tools/Tests/check_zsign_provisioning.py
        python3 Tools/Tests/check_update_publisher.py
        python3 Tools/Tests/check_live_sources.py
        python3 Tools/Tests/check_catalog_runner.py
        python3 Tools/Tests/check_options_compat.py --swiftc "$compiler" --sdk "$sdk" --target "$target"
        node Tools/Tests/xsign_panel_metadata_checks.cjs
        "$compiler" -sdk "$sdk" -target "$target" -swift-version 5 -parse-as-library \
          Feather/Utilities/XSignRESTSource.swift Feather/Utilities/XSignSelfUpdateManifest.swift \
          Feather/Utilities/XSignArtworkLookup.swift \
          Tools/Tests/xsign_native_features_checks.swift -o "$RUNNER_TEMP/xsign_native_checks"
        python3 Tools/Tests/run_catalog_checks.py --executable "$RUNNER_TEMP/xsign_native_checks" \
          --fixture-script Tools/Tests/xsign_rest_fixture.py --log-dir "$RUNNER_TEMP/native-features"
        "$compiler" -sdk "$sdk" -target "$target" -swift-version 5 -parse-as-library \
          Feather/Utilities/XSignBatchQueue.swift Feather/Utilities/XSignProvisioningProfile.swift \
          Tools/Tests/xsign_batch_profile_checks.swift -o "$RUNNER_TEMP/xsign_batch_profile_checks"
        "$RUNNER_TEMP/xsign_batch_profile_checks"
        python3 Tools/Tests/xsign_make_tests.py
        printf 'Compiling the catalog integration checks\n'
        "$compiler" -sdk "$sdk" -target "$target" -swift-version 5 -O -g -parse-as-library \
          "$RUNNER_TEMP/xsign_catalog_loading_tests.swift" -o "$RUNNER_TEMP/xsign_catalog_checks"
        printf 'Catalog compilation completed\n'
        python3 Tools/Tests/run_catalog_checks.py --executable "$RUNNER_TEMP/xsign_catalog_checks" --log-dir "$RUNNER_TEMP"

        } 2>&1 | tee "$RUNNER_TEMP/xsign-appstore-all-checks.log"
    - name: Build and verify XSign IPA
      id: build
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        XSIGN_BUILD_NUMBER="$(python3 -c 'import os; n=1000+int(os.environ["GITHUB_RUN_NUMBER"]); assert 0<n<10000; print(n)')"
        export XSIGN_BUILD_NUMBER
        printf 'XSIGN_BUILD_NUMBER=%s
        ' "$XSIGN_BUILD_NUMBER" >> "$GITHUB_ENV"
        make XSIGN_BUILD_NUMBER="$XSIGN_BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/xsign-appstore-build.log"
        python3 - <<'VERIFY_IPA'
        from pathlib import Path
        import json,zipfile
        ipa=Path('packages/X-SIGN.ipa')
        with zipfile.ZipFile(ipa) as z:
         assert z.testzip() is None
         for seed in ['XSignCatalogIPABlack','XSignLaunchIPABlack','XSignCatalogIPAOMTKLive','XSignLaunchIPAOMTKLive']:
          paths=[n for n in z.namelist() if n.endswith('/'+seed+'.json')]
          assert len(paths)==1,seed
          assert isinstance(json.loads(z.read(paths[0]))['apps'],list),seed
         assert not any(any(retired in n for retired in ['XSignCatalogStoreAPI.json','XSignLaunchStoreAPI.json','XSignCatalogReference.json','XSignLaunchReference.json']) for n in z.namelist())
        print('Verified the built IPA and all retained offline catalogs')
        VERIFY_IPA
    - name: Prepare verified update assets
      if: ${{ success() && steps.checks.outcome == 'success' && steps.build.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p update
        cp packages/X-SIGN.ipa update/XSign.ipa
        tag="xsign-native-${XSIGN_BUILD_NUMBER}-${GITHUB_RUN_ATTEMPT}"
        printf 'XSIGN_RELEASE_TAG=%s
        ' "$tag" >> "$GITHUB_ENV"
        python3 Tools/Publish_XSign_Update.py --ipa update/XSign.ipa --tag "$tag" --output update/xsign-update.json
        python3 - <<'RELEASE_VERSION'
        from pathlib import Path
        import os,json
        version=json.loads(Path('update/xsign-update.json').read_text())['version']
        with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('XSIGN_RELEASE_VERSION='+version+'\n')
        RELEASE_VERSION
    - name: Upload the updated XSign IPA
      if: ${{ success() && steps.checks.outcome == 'success' && steps.build.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: XSign-v12-IPA
        path: |-
          update/XSign.ipa
          update/xsign-update.json
        if-no-files-found: error
        retention-days: 14
    - name: Save successful original source files
      id: save
      if: ${{ success() && steps.checks.outcome == 'success' && steps.build.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        git diff --check
        python3 - <<'STAGE_REVIEWED'
        from pathlib import Path
        import subprocess
        paths = ['Feather/Backend/Observable/DownloadManager.swift', 'Feather/Backend/Observable/UpdateManager.swift', 'Feather/Backend/Observable/XSignSelfUpdateService.swift', 'Feather/Backend/Storage/Storage+SourceMetadata.swift', 'Feather/FeatherApp.swift', 'Feather/Resources/XSignCatalogReference.json', 'Feather/Resources/XSignLaunchReference.json', 'Feather/Utilities/FR.swift', 'Feather/Utilities/Handlers/AppFileHandler.swift', 'Feather/Utilities/XSignArtworkLookup.swift', 'Feather/Utilities/XSignIPAProvider.swift', 'Feather/Utilities/XSignProvisioningProfile.swift', 'Feather/Utilities/XSignRESTSource.swift', 'Feather/Utilities/XSignSearch.swift', 'Feather/Utilities/XSignSelfUpdateManifest.swift', 'Feather/Views/Library/LibraryView.swift', 'Feather/Views/Library/XSignAppStoreLinkView.swift', 'Feather/Views/Library/XSignArtworkView.swift', 'Feather/Views/Settings/SettingsView.swift', 'Feather/Views/Settings/XSignSelfUpdateView.swift', 'Feather/Views/Sources/SourcesAddView.swift', 'Feather/Views/Sources/SourcesView.swift', 'Feather/Views/Sources/SourcesViewModel.swift', 'Makefile', 'Tools/Convert_XSign_Source.swift', 'Tools/Extract_IPASoon_Sources.py', 'Tools/Normalize_Reference_Catalog.py', 'Tools/Publish_XSign_Update.py', 'Tools/Sync_Live_Sources.py', 'Tools/Tests/check_catalog_runner.py', 'Tools/Tests/check_live_sources.py', 'Tools/Tests/check_source_extraction.py', 'Tools/Tests/check_update_publisher.py', 'Tools/Tests/prepare_catalog_fixture.py', 'Tools/Tests/run_catalog_checks.py', 'Tools/Tests/xsign_catalog_checks.swift', 'Tools/Tests/xsign_fixture_server.py', 'Tools/Tests/xsign_ipa_checks.swift', 'Tools/Tests/xsign_make_tests.py', 'Tools/Tests/xsign_native_features_checks.swift', 'Tools/Tests/xsign_panel_metadata_checks.cjs', 'Tools/Tests/xsign_rest_fixture.py', 'Tools/XSign_Review_AR.md', 'Tools/XSign_Studio.html', 'Tools/XSign_V12_Installed.json', 'public/sources/ipasoon.json']
        for name in paths:
         if Path(name).exists() or subprocess.run(['git','ls-files','--error-unmatch',name],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode == 0:
          subprocess.run(['git','add','-A','--',name],check=True)
        STAGE_REVIEWED
        test -z "$(git diff --cached --name-only -- .github/workflows)"
        if ! git diff --cached --quiet; then
         git config user.name 'github-actions[bot]'
         git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
         git commit -m 'Add XSign primary REST catalog and verified self updates; remove App Store IPA download'
         git fetch origin main
         current_parent="$(git rev-parse HEAD^)"
         if test "$(git rev-parse origin/main)" != "$current_parent"; then
          python3 - "$current_parent" <<'CHECK_CONCURRENT'
        import subprocess,sys
        changed=subprocess.check_output(['git','diff','--name-only',sys.argv[1],'origin/main'],text=True).splitlines()
        if any(not p.startswith('public/sources/') for p in changed):
         raise SystemExit('Main changed outside live catalog data. Rerun this workflow against current main; no force push was attempted.')
        CHECK_CONCURRENT
          git rebase origin/main
         fi
         git push origin HEAD:main
        fi
        printf 'sha=%s
        ' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Publish the internal XSign update
      if: ${{ success() && steps.checks.outcome == 'success' && steps.build.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        XSIGN_SOURCE_SHA: ${{ steps.save.outputs.sha }}
      run: |
        set -euo pipefail
        gh release create "$XSIGN_RELEASE_TAG" update/XSign.ipa update/xsign-update.json --repo "$GITHUB_REPOSITORY" --target "$XSIGN_SOURCE_SHA" --title "XSign ${XSIGN_RELEASE_VERSION} (${XSIGN_BUILD_NUMBER})" --notes 'XSign: primary library, native search and verified local self update.' --draft
        gh release edit "$XSIGN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
    - name: Upload test and build evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: XSign-v12-Logs
        path: |-
          ${{ runner.temp }}/xsign-appstore-*.log
          ${{ runner.temp }}/native-features/*.log
          ${{ runner.temp }}/xsign_catalog_loading_tests.swift
        if-no-files-found: ignore
        retention-days: 14
  refresh-ipaomtk:
    if: github.repository == 'ipa-black/X-SIGN' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout current XSign
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Refresh the retained IPAOMTK source
      shell: bash
      run: |
        set -euo pipefail
        # Wait until the reviewed native migration has succeeded at least once.
        if ! test -f Tools/XSign_V12_Installed.json; then
         printf 'Install XSign v12 successfully before refreshing its managed feed.\n'
         exit 0
        fi
        python3 Tools/Sync_Live_Sources.py
        git add -- public/sources/ipaomtk.json public/sources/status.json
        if ! git diff --cached --quiet; then
         git config user.name 'github-actions[bot]'
         git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
         git commit -m 'Refresh XSign IPAOMTK live catalog'
         git pull --rebase origin main
         git push origin HEAD:main
        fi
